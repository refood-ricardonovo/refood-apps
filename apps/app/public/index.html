<!doctype html>
<html lang="pt-PT">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Refood</title>

		<link rel="icon" href="/img/favicon.ico" sizes="any" />
		<link rel="stylesheet" href="/tokens.css" />

		<!--
			O manifest é o que torna isto instalável. O `theme_color` está lá dentro e repete-se aqui
			porque o browser lê a meta antes de ir buscar o manifest: sem ela, a barra do sistema
			pisca a claro no primeiro instante.
		-->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#0f0f0f" />

		<!--
			O iOS ignora o manifest para o ícone e para o modo de ecrã inteiro: quer as suas próprias
			metas. `apple-mobile-web-app-capable` está obsoleta em favor de `mobile-web-app-capable`,
			mas as versões de iOS que hoje andam nos telemóveis ainda só entendem a antiga — vão as
			duas, e sai a antiga quando deixar de ser precisa.
		-->
		<link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Refood" />

		<style>
			/*
			 * Uma página: o logótipo ao meio de um fundo escuro, e mais nada.
			 *
			 * **É descartável.** Existe para uma apresentação, e o que vier a ser a PWA não se
			 * parece com isto. Nada aqui é fundação — nem o modo escuro, que é escolha deste ecrã
			 * e não uma decisão sobre o aspecto da app. Ver o CLAUDE.md desta app.
			 */
			* {
				box-sizing: border-box;
				margin: 0;
			}

			html,
			body {
				height: 100%;
			}

			body {
				background: var(--n-950);
				color: var(--n-000);
				font-family: var(--fonte);

				display: grid;
				place-items: center;
				/*
				 * `100dvh` e não `100vh`: em `standalone` no iOS a barra do sistema entra na conta e
				 * o `vh` empurrava o logótipo para fora do centro. O `padding` do `safe-area` é o
				 * que o mantém longe do entalhe e da barra de gestos.
				 */
				min-height: 100dvh;
				padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom))
					max(24px, env(safe-area-inset-left));
			}

			/*
			 * A largura do logótipo.
			 *
			 * `min(70vw, 420px)` dá ~270px num telemóvel estreito e trava nos 420 num tablet — bem
			 * acima do mínimo de **96px** que o `docs/design.md` fixa para a versão horizontal, e com
			 * a margem de proteção (a altura do "F" de FOOD, em toda a volta) folgadamente cumprida
			 * pelo próprio centro do ecrã.
			 *
			 * `height: auto` desfaz os `width`/`height` em px que o Illustrator deixou no SVG.
			 */
			.logotipo {
				width: min(70vw, 420px);
				height: auto;
			}

			/* ------------------------------------------------------------- a entrada */

			body {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 40px;
			}

			.entrada {
				display: flex;
				flex-direction: column;
				gap: 16px;
				width: min(70vw, 420px);
			}

			/*
			 * O campo aceita o que a pessoa escrever — espaços incluídos. **Quem normaliza é o
			 * servidor**, que tira tudo o que não é dígito: um campo que recuse um espaço obriga
			 * quem tem o NIF escrito num papel com espaços a adivinhar o que a app quer.
			 *
			 * `inputmode="numeric"` traz o teclado numérico no telemóvel sem impedir a colagem de um
			 * valor com espaços, que é o que `type="number"` faria.
			 */
			#nif {
				font-family: inherit;
				font-size: 28px;
				letter-spacing: 0.08em;
				text-align: center;
				padding: 16px;
				border-radius: 10px;
				border: 2px solid #3a3a3a;
				background: #1a1a1a;
				color: var(--n-000);
			}

			#nif:focus-visible {
				outline: 3px solid var(--marca-amarelo);
				outline-offset: 2px;
			}

			#entrar {
				font-family: inherit;
				font-size: 22px;
				font-weight: 700;
				padding: 16px;
				border: 0;
				border-radius: 10px;
				background: var(--marca-amarelo);
				/* Amarelo é fundo; sobre ele o texto é escuro. Nunca o contrário. Ver docs/design.md. */
				color: #0f0f0f;
				cursor: pointer;
			}

			#entrar[disabled] {
				opacity: 0.5;
				cursor: default;
			}

			/*
			 * A resposta por baixo. `aria-live` para quem usa leitor de ecrã ouvir o resultado sem
			 * ter de ir à procura dele — é o único conteúdo desta página que muda sozinho.
			 */
			.resposta {
				min-height: 4em;
				text-align: center;
				font-size: 20px;
				line-height: 1.4;
			}

			.resposta b {
				display: block;
				font-size: 30px;
				font-weight: 700;
			}

			/*
			 * **O vermelho é só para o erro de formato**, que é uma correcção — o NIF são nove
			 * dígitos, corrige e tenta.
			 *
			 * O "ainda não te encontrámos" fica **a branco**, como o resto do texto. Vai ser lido por
			 * dezenas de pessoas ao mesmo tempo, numa sala, e uma em catorze fichas activas não tem
			 * NIF utilizável: a vermelho lê-se como recusa, e não é uma recusa — é uma ficha por
			 * completar, que o núcleo trata. Ver `semFicha`, em `entrar.ts`.
			 */
			.resposta[data-estado='formato'] {
				color: #ff7a6e;
			}

			/*
			 * **O `hidden` tem de ganhar a um `display` declarado.** O `.entrada` é `flex`, e uma
			 * regra que declare `display` bate o `display: none` que o atributo traz da folha de
			 * estilos do browser. Sem este `!important`, esconder o formulário não o esconde.
			 */
			[hidden] {
				display: none !important;
			}

			.aviso {
				text-align: center;
				font-size: 24px;
				line-height: 1.4;
				color: #d6d6d6;
				max-width: min(80vw, 460px);
			}
		</style>
	</head>
	<body>
		<!--
			O logótipo e não a palavra em texto: o guia da marca não prevê um wordmark escrito à mão,
			e este ficheiro é a variante para fundo escuro que o guia autoriza. O `alt` leva o nome,
			que é o que um leitor de ecrã precisa de dizer.
		-->
		<img class="logotipo" src="/img/refood_logo_horizontal_fundo_escuro.svg" alt="Refood" />

		<!--
			**A página nasce fechada, e é essa a versão certa quase sempre.**

			A entrada por NIF é um atalho de uma apresentação; o estado normal, a partir do dia
			seguinte, é fechado. Por isso o que está no HTML é a versão fechada, e o formulário só
			aparece se o servidor disser que a porta está aberta — `GET /api/estado`.

			Sai daqui de graça: o estado normal não pisca, sem JavaScript vê-se a versão certa em vez
			de um formulário que não funcionaria, e com a API em baixo vê-se a mesma coisa.
		-->
		<p class="aviso" id="fechada">A app dos voluntários está a chegar.</p>

		<form class="entrada" id="entrada" hidden>
			<label for="nif">Escreve o teu NIF</label>
			<input id="nif" name="nif" inputmode="numeric" autocomplete="off" placeholder="000 000 000" />
			<button id="entrar" type="submit">Entrar</button>
		</form>

		<p class="resposta" id="resposta" role="status" aria-live="polite" hidden></p>

		<script>
			/*
			 * O service worker existe por uma razão só: **sem ele o Chrome não oferece instalar.**
			 * O critério de instalação no Android é manifest + um service worker com handler de
			 * `fetch`; o iOS instala sem nenhum.
			 *
			 * Não guarda nada e não serve nada de cache — ver `sw.js`. Registado depois do `load`
			 * para não competir com o que a página está a desenhar, e com a falha engolida: um
			 * registo que falhe tira o botão de instalar, não parte a página.
			 */
			if ('serviceWorker' in navigator) {
				addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js').catch(() => {});
				});
			}

			/*
			 * A entrada. Manda o NIF tal como foi escrito — **quem normaliza é o servidor**, que é
			 * também quem decide se há ficha. O ecrã não valida nada para lá de não deixar mandar
			 * um campo vazio: uma segunda regra aqui era uma segunda regra para manter.
			 *
			 * Tudo por `textContent`: o nome vem do Odoo, e nome de pessoa nunca se interpola em
			 * marcação.
			 */
			const entrada = document.getElementById('entrada');
			const campo = document.getElementById('nif');
			const botao = document.getElementById('entrar');
			const resposta = document.getElementById('resposta');
			const fechada = document.getElementById('fechada');

			/*
			 * **Quem decide qual das duas páginas se vê é o servidor.**
			 *
			 * A página abre fechada e só troca se o `/api/estado` disser que sim. Se o pedido falhar
			 * — rede, Worker em baixo —, não se troca nada: fica a versão fechada, que é honesta em
			 * qualquer dos casos e não é um formulário que não ia funcionar.
			 */
			async function abrirSePermitido() {
				try {
					const pedido = await fetch('/api/estado');
					const corpo = await pedido.json();
					if (!corpo.aberta) return;

					fechada.hidden = true;
					entrada.hidden = false;
					resposta.hidden = false;
				} catch {
					// Fica fechada. Ver acima.
				}
			}

			abrirSePermitido();

			function mostrar(estado, texto, destaque) {
				resposta.replaceChildren();
				resposta.dataset.estado = estado;

				if (destaque) {
					const b = document.createElement('b');
					b.textContent = destaque;
					resposta.append(b);
				}
				resposta.append(document.createTextNode(texto));
			}

			entrada.addEventListener('submit', async (evento) => {
				evento.preventDefault();
				if (campo.value.trim() === '') return;

				botao.disabled = true;
				mostrar('', 'A procurar…');

				try {
					const pedido = await fetch('/api/entrar', {
						method: 'POST',
						headers: { 'content-type': 'application/json' },
						body: JSON.stringify({ nif: campo.value }),
					});
					const corpo = await pedido.json();

					if (corpo.ok) {
						mostrar('ok', corpo.nucleo ?? '', `Olá, ${corpo.nome ?? ''}`);
						campo.value = '';
					} else {
						// O `erro` que o servidor devolve é o que escolhe a cor: só o `formato` sai a
						// vermelho. Ver o CSS.
						mostrar(corpo.erro ?? '', corpo.mensagem ?? 'Não foi possível entrar.', corpo.titulo);
					}
				} catch {
					// Sem rede, ou o Worker em baixo. Não se distingue, e para quem está à frente do
					// telemóvel a resposta é a mesma: tentar outra vez.
					mostrar('', 'Sem ligação. Tenta outra vez.');
				} finally {
					botao.disabled = false;
				}
			});
		</script>
	</body>
</html>
