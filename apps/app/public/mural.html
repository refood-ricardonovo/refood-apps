<!doctype html>
<html lang="pt-PT">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Refood — mural</title>

		<link rel="icon" href="/img/favicon.ico" sizes="any" />
		<link rel="stylesheet" href="/tokens.css" />
		<meta name="theme-color" content="#0f0f0f" />

		<!--
			**Fora do índice.** É um ecrã de apresentação, com primeiros nomes de pessoas reais, e não
			tem por que aparecer numa pesquisa. Não substitui controlo de acesso nenhum — o que fecha
			isto é o interruptor da entrada, do lado do servidor.
		-->
		<meta name="robots" content="noindex, nofollow" />

		<style>
			/*
			 * O mural: projectado num PC, numa sala com cerca de 300 pessoas, visto a dez metros.
			 *
			 * **Não tem interacção nenhuma, e isso é o requisito.** Nada focável, nenhum `<button>`,
			 * nenhum `<a>`, nenhum campo — quem está à frente do projector não é quem o opera, e um
			 * elemento focável num ecrã projectado é um elemento que alguém carrega por engano.
			 *
			 * **Duas metades com naturezas diferentes.** A coluna da esquerda é **estado**: que núcleos
			 * estão na sala, e ficam — sem contagens, por decisão. A área principal é **acontecimento**:
			 * cada nome passa uma vez, quando a pessoa entra, e desaparece. Nada se recicla para encher
			 * o ecrã.
			 *
			 * Mesmo fundo da página de entrada, pela mesma razão: é a mesma demonstração. Não é uma
			 * decisão sobre o aspecto da PWA — ver o CLAUDE.md desta app.
			 */
			* {
				box-sizing: border-box;
				margin: 0;
			}

			html,
			body {
				height: 100%;
			}

			body {
				background: var(--n-950);
				color: var(--n-000);
				font-family: var(--fonte);
				font-weight: 500; /* sobre fundo escuro, o 400 esvai-se a dez metros */
				display: grid;
				grid-template-rows: auto 1fr auto;
				overflow: hidden;
			}

			/*
			 * A barra de cima: logótipo à esquerda, o endereço ao centro, o QR à direita.
			 *
			 * Três colunas `1fr auto 1fr` e não um `space-between`: com o `space-between` o endereço
			 * deslocava-se para o lado do elemento mais estreito, e o que se quer é o centro do ecrã.
			 */
			header {
				display: grid;
				grid-template-columns: 1fr auto 1fr;
				align-items: center;
				gap: 24px;
				padding: 20px 32px;
				border-bottom: 2px solid #2b2b2b;
			}

			/*
			 * O logótipo, à altura da barra que o QR criou. Aos 46 px de antes ficava perdido numa barra
			 * de 160 px, e o logótipo é a primeira coisa que a sala tem de reconhecer.
			 *
			 * **Os 88 px são o que a margem de proteção permite**, e não o máximo que caberia: o
			 * `docs/design.md` fixa uma margem igual à altura do "F" de FOOD em toda a volta — a esta
			 * altura são uns 34 px, e é o que sobra entre ele, o `padding` de 20 px e o QR de 120 px.
			 * Encher a barra até aos 120 px ganhava presença e perdia a margem.
			 *
			 * **`justify-self: start` não é decoração:** numa grelha, um `<img>` de largura automática
			 * esticava-se ao tamanho da coluna e o logótipo saía deformado.
			 */
			header img {
				height: 88px;
				justify-self: start;
			}

			/* O endereço, para quem está na sala escrever no telemóvel sem ler um QR. */
			.endereco {
				font-size: 36px;
				font-weight: 700;
				color: var(--marca-amarelo);
			}

			/*
			 * O QR aponta para `myrefood.pt` e é um SVG **gerado uma vez e comprometido no repositório**:
			 * a página não carrega biblioteca nenhuma nem gera nada em runtime.
			 *
			 * **Módulos escuros sobre branco, com a zona de silêncio dentro do próprio ficheiro.** Há
			 * leitores que não lêem um QR invertido, e um QR que não lê num ecrã projectado não tem
			 * segunda tentativa. É também por isso que não leva o amarelo da marca.
			 *
			 * **O tamanho é o que a barra dá, e isso limita a distância de leitura**: a regra prática é
			 * cerca de dez vezes o lado do código. Aos 120 px de um 1080p projectado a ~2,2 m de largura
			 * são uns 14 cm de lado, portanto lê-se de perto ou com o zoom da câmara — quem está no fundo
			 * da sala escreve o endereço, que é o que ele ali está a fazer.
			 */
			.qr {
				justify-self: end;
				display: block;
				width: 120px;
				height: 120px;
				border-radius: 6px;
			}

			.corpo {
				display: grid;
				grid-template-columns: minmax(280px, 24%) 1fr;
				min-height: 0;
			}

			/* ------------------------------------------------- a coluna dos núcleos */

			.nucleos {
				border-right: 2px solid #2b2b2b;
				overflow: hidden;
				position: relative;
			}

			/*
			 * **O scroll automático é uma animação de CSS, e só existe quando é preciso.**
			 *
			 * Quando a lista passa da altura do ecrã, o rolo passa a conter os núcleos **duas vezes** e
			 * desliza até -50%: a segunda cópia chega ao topo no instante em que a primeira sai, e a
			 * volta não tem costura. A duração vem da altura, para a velocidade ser a mesma com dez
			 * núcleos ou com trinta. Ninguém lhe toca.
			 *
			 * **Só a chegada de um núcleo novo reconstrói a lista.** Reconstruí-la a cada sonda
			 * reiniciava esta animação e fazia a coluna saltar para o início de cinco em cinco segundos.
			 * Como não há contagens a actualizar, uma lista igual não dá trabalho nenhum ao DOM.
			 */
			.rolo {
				padding: 20px 0;
			}

			.rolo[data-rolar='sim'] {
				animation: rolar var(--duracao, 60s) linear infinite;
			}

			@keyframes rolar {
				from {
					transform: translateY(0);
				}
				to {
					transform: translateY(-50%);
				}
			}

			.nucleo {
				padding: 12px 32px;
				font-size: 32px;
				color: #d6d6d6;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			/* ------------------------------------------------------------ o rodapé */

			/*
			 * Baixo de propósito: rouba o mínimo à nuvem, que é o que a sala está a ver.
			 *
			 * **O roxo do Odoo aparece clareado.** O `#714b67` da marca sobre este fundo é escuro sobre
			 * escuro e a dez metros não se lê; o `#c79bc0` é o mesmo tom com luz suficiente para passar
			 * num projector. Legibilidade primeiro — um roxo exacto que ninguém vê não é o roxo.
			 */
			footer {
				display: flex;
				align-items: baseline;
				justify-content: space-between;
				gap: 24px;
				padding: 10px 32px;
				border-top: 2px solid #2b2b2b;
				font-size: 22px;
				color: #9a9a9a;
			}

			footer .odoo {
				color: #c79bc0;
			}

			/* ------------------------------------------------------------- a nuvem */

			.nuvem {
				position: relative;
				overflow: hidden;
			}

			/*
			 * **O estado de repouso da nuvem é um "Obrigado", e é grande.** Só aparece quando não há
			 * nenhum nome no ecrã, portanto não compete com nada — e ao fim da sessão é o que fica na
			 * parede. O amarelo é acento sobre fundo escuro, que é o uso que o guia da marca prevê.
			 *
			 * **Translúcido de propósito.** A cheio, um amarelo deste tamanho puxava o olhar da sala
			 * para uma palavra que é fundo, não acontecimento: os nomes é que são o ecrã. A 35% lê-se
			 * de longe e não se impõe. É opacidade e não uma cor mais escura, para o dia em que o fundo
			 * mudar não haver um amarelo a mais para acertar.
			 */
			.espera {
				display: grid;
				place-items: center;
				height: 100%;
				font-size: clamp(80px, 13vmin, 200px);
				font-weight: 800;
				letter-spacing: -0.02em;
				color: var(--marca-amarelo);
				opacity: 0.35;
			}

			/*
			 * Um nome da nuvem.
			 *
			 * **O corpo mínimo é a conta dos dez metros:** a altura de maiúscula legível é cerca de 1/200
			 * da distância — ~5 cm a 10 m —, o que num 1080p projectado a ~2,2 m de largura dá perto de
			 * 44 px de corpo. O chão está bem acima disso, a pedido: o nome é o que a sala olha.
			 *
			 * A variação de tamanho é ±20%, por `--f`, e serve para a nuvem não parecer uma tabela.
			 *
			 * **Só branco e o amarelo da marca.** Sem cor por núcleo — uma cor por núcleo obrigava a sala
			 * a decorar uma legenda para ler um nome — e sem imagens.
			 */
			.nome {
				position: absolute;
				transform: translate(-50%, -50%);
				white-space: nowrap;
				font-size: calc(clamp(56px, 7.5vmin, 120px) * var(--f, 1));
				font-weight: 700;
				opacity: 0;
				/*
				 * `fade in` 0,6 s → **9 s visível** → `fade out` 0,8 s. Os `%` do keyframe saem daí, e a
				 * duração total é a soma. O elemento sai do DOM no `animationend`, e é aí que a célula da
				 * grelha fica livre outra vez.
				 */
				animation: passar 10.4s ease-in-out forwards;
			}
			}

			.nome[data-cor='amarelo'] {
				color: var(--marca-amarelo);
			}

			@keyframes passar {
				0% {
					opacity: 0;
					transform: translate(-50%, -50%) scale(0.9);
				}
				6% {
					opacity: 1;
					transform: translate(-50%, -50%) scale(1);
				}
				92% {
					opacity: 1;
					transform: translate(-50%, -50%) scale(1);
				}
				100% {
					opacity: 0;
					transform: translate(-50%, -50%) scale(1.04);
				}
			}

			/*
			 * Quem tiver o sistema a pedir menos movimento continua a ver os nomes: o que se tira é o
			 * deslizar e a escala, não a informação. O rolo dos núcleos passa a estático — com muitos
			 * núcleos isso corta o que fica em baixo, e é a troca certa: quem pediu menos movimento
			 * pediu-o por alguma razão.
			 */
			@media (prefers-reduced-motion: reduce) {
				.rolo[data-rolar='sim'] {
					animation: none;
				}

				.nome {
					animation: aparecer 10.4s steps(1, end) forwards;
				}

				@keyframes aparecer {
					0% {
						opacity: 1;
					}
					100% {
						opacity: 0;
					}
				}
			}
		</style>
	</head>
	<body>
		<header>
			<img src="/img/refood_logo_horizontal_fundo_escuro.svg" alt="Refood" />
			<span class="endereco">myrefood.pt</span>
			<!--
				O `alt` leva o endereço e não a palavra "QR": quem não vê a imagem precisa do destino,
				não do nome da tecnologia.
			-->
			<img class="qr" src="/img/qr-myrefood.svg" alt="myrefood.pt" />
		</header>

		<div class="corpo">
			<div class="nucleos"><div class="rolo" id="rolo"></div></div>
			<div class="nuvem" id="nuvem"><p class="espera" id="espera">Obrigado</p></div>
		</div>

		<footer>
			<span>10º ENC Nacional | Viseu</span>
			<span class="odoo">Equipa Executiva Odoo</span>
		</footer>

		<script>
			/*
			 * **O `/mural` simples nunca limpa.** Se limpasse ao abrir, um recarregamento a meio da
			 * sessão — ou um segundo portátil no mesmo endereço — apagava o que já lá estava, com a
			 * sala toda a ver. O reinício é deliberado: só com `?reiniciar` no endereço, e o
			 * parâmetro é tirado a seguir para um F5 não voltar a limpar.
			 */
			const SONDA_MS = 5000;

			async function reiniciarSePedido() {
				if (!new URLSearchParams(location.search).has('reiniciar')) return;

				await fetch('/api/mural/reiniciar', { method: 'POST' }).catch(() => {});
				history.replaceState(null, '', location.pathname);
			}

			/* ------------------------------------------------- a coluna dos núcleos */

			/** Velocidade do rolo, em píxeis por segundo. Lento o suficiente para se ler a passar. */
			const VELOCIDADE_PX_S = 22;

			const rolo = document.getElementById('rolo');

			/** Qual era a lista de núcleos da última vez. Só uma lista diferente reconstrói o DOM. */
			let chaveDosNucleos = '';

			function linhaDeNucleo(nome) {
				const linha = document.createElement('div');
				linha.className = 'nucleo';
				linha.textContent = nome;
				return linha;
			}

			function reconstruirNucleos(nucleos) {
				rolo.replaceChildren();
				rolo.dataset.rolar = 'nao';

				const juntar = () => {
					for (const nome of nucleos) rolo.append(linhaDeNucleo(nome));
				};

				juntar();

				/*
				 * Só depois de a primeira cópia estar no DOM é que se sabe se transborda. Se
				 * transbordar, junta-se a segunda cópia e liga-se a animação: o `-50%` do keyframe
				 * assume exactamente duas cópias.
				 */
				const cabe = rolo.scrollHeight <= rolo.parentElement.clientHeight;
				if (cabe) return;

				const altura = rolo.scrollHeight;
				juntar();
				rolo.style.setProperty('--duracao', `${Math.round(altura / VELOCIDADE_PX_S)}s`);
				rolo.dataset.rolar = 'sim';
			}

			function desenharNucleos(mural) {
				const chave = mural.nucleos.join('|');
				if (chave === chaveDosNucleos) return;

				chaveDosNucleos = chave;
				reconstruirNucleos(mural.nucleos);
			}

			/* ------------------------------------------------------------- a nuvem */

			const nuvem = document.getElementById('nuvem');
			const espera = document.getElementById('espera');

			/*
			 * **Uma grelha invisível por trás da posição aleatória.**
			 *
			 * Aleatório puro amontoa três nomes num canto e deixa metade do ecrã vazio. Escolhe-se uma
			 * célula livre e desvia-se um pouco dentro dela: a distribuição fica solta sem ficar alinhada.
			 * Com todas ocupadas, escolhe-se a que está ocupada há mais tempo — a sobreposição ocasional é
			 * bem-vinda, o amontoado não.
			 *
			 * **Cinco colunas e não seis**: os nomes ficaram maiores, e numa célula mais estreita do que o
			 * nome que lá cabe a vizinhança deixa de ser sobreposição ocasional e passa a ser regra.
			 */
			const COLUNAS = 5;
			const LINHAS = 4;
			const DESVIO = 0.35; // do tamanho da célula, para cada lado
			const celulas = Array.from({ length: COLUNAS * LINHAS }, () => 0);

			function escolherCelula(agora) {
				const livres = [];
				for (let i = 0; i < celulas.length; i++) if (celulas[i] === 0) livres.push(i);

				if (livres.length > 0) return livres[Math.floor(Math.random() * livres.length)];

				// Nenhuma livre: a que está ocupada há mais tempo é a que está mais perto de sair.
				let escolhida = 0;
				for (let i = 1; i < celulas.length; i++) if (celulas[i] < celulas[escolhida]) escolhida = i;
				celulas[escolhida] = agora;
				return escolhida;
			}

			function mostrarNome(texto) {
				espera.hidden = true;

				const agora = performance.now();
				const celula = escolherCelula(agora);
				celulas[celula] = agora;

				const coluna = celula % COLUNAS;
				const linha = Math.floor(celula / COLUNAS);
				const desvio = () => (Math.random() * 2 - 1) * DESVIO;

				const el = document.createElement('span');
				el.className = 'nome';
				el.textContent = texto;
				el.style.left = `${((coluna + 0.5 + desvio()) / COLUNAS) * 100}%`;
				el.style.top = `${((linha + 0.5 + desvio()) / LINHAS) * 100}%`;
				el.style.setProperty('--f', (0.8 + Math.random() * 0.4).toFixed(2));
				if (Math.random() < 0.4) el.dataset.cor = 'amarelo';

				// A célula só fica livre quando o nome sai a sério do ecrã.
				el.addEventListener('animationend', () => {
					el.remove();
					celulas[celula] = 0;
					if (nuvem.querySelectorAll('.nome').length === 0) espera.hidden = false;
				});

				nuvem.append(el);
			}

			/*
			 * **A fila, com intervalo contínuo.**
			 *
			 * Dez nomes a surgir juntos é ilegível, portanto entram espaçados. Mas um intervalo fixo
			 * de meio segundo sustenta dois nomes por segundo, e trezentas pessoas a entrarem em dois
			 * minutos criam uma fila que só esvazia depois de a sala estar sentada.
			 *
			 * O intervalo encurta com o tamanho da fila, entre 900 ms e um chão de 400 ms, por uma curva e
			 * não por um degrau: `min + (max - min) / (1 + n / suavidade)`. Com a fila vazia são 900 ms;
			 * com quatro à espera, 650; com vinte, 483; e nunca abaixo de 400. **Não há salto visível**,
			 * porque a curva é contínua e recalcula-se a cada nome.
			 *
			 * **Os números subiram quando o nome passou a durar nove segundos.** Com os 500 ms de antes
			 * viviam no ecrã mais de vinte nomes ao mesmo tempo, e vinte nomes grandes em vinte células
			 * não é uma nuvem, é uma parede. O preço é a fila esvaziar mais devagar, e é o preço certo:
			 * o que se pediu foi o nome maior e mais tempo no ecrã.
			 */
			const INTERVALO_MAX = 900;
			const INTERVALO_MIN = 400;
			const SUAVIDADE = 4;

			const fila = [];
			let aDrenar = false;

			function intervaloDaFila(n) {
				return INTERVALO_MIN + (INTERVALO_MAX - INTERVALO_MIN) / (1 + n / SUAVIDADE);
			}

			function drenar() {
				const nome = fila.shift();
				if (nome === undefined) {
					aDrenar = false;
					return;
				}

				mostrarNome(nome);
				setTimeout(drenar, intervaloDaFila(fila.length));
			}

			function enfileirar(nomes) {
				for (const nome of nomes) fila.push(nome);
				if (aDrenar || fila.length === 0) return;

				aDrenar = true;
				drenar();
			}

			/* ------------------------------------------------------------- a sonda */

			/**
			 * O cursor da janela. **A primeira sonda vai sem ele e não traz nomes** — a nuvem é o que está
			 * a acontecer, e quem abrir o mural a meio vê os núcleos presentes sem ver passar quem já
			 * entrou. Ver `mural.ts`.
			 */
			let desde = null;

			async function sondar() {
				try {
					const pedido = await fetch(desde ? `/api/mural?desde=${encodeURIComponent(desde)}` : '/api/mural');
					const corpo = await pedido.json();
					if (!corpo.ok) return;

					desde = corpo.mural.agora;
					desenharNucleos(corpo.mural);
					enfileirar(corpo.mural.novos);
				} catch {
					// Uma falha de rede não apaga o que está no ecrã, e não mexe no cursor: a sonda
					// seguinte volta a pedir a mesma janela. Um mural que pisca a vazio de cinco em
					// cinco segundos é pior do que um mural com cinco segundos de atraso.
				}
			}

			// Numa função e não com `await` de topo, que exigiria `type="module"` — e um script de
			// módulo é diferido e com escopo próprio, o que muda mais do que o que aqui se precisa.
			(async () => {
				await reiniciarSePedido();
				await sondar();
				setInterval(sondar, SONDA_MS);
			})();
		</script>
	</body>
</html>
