<!doctype html>
<html lang="pt-PT">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Refood — entregas</title>
		<link rel="icon" href="/img/favicon.ico" sizes="any" />
		<link rel="stylesheet" href="/tokens.css" />
		<style>
			/*
			 * O painel de entregas. Televisor de cozinha, visto de três a quatro metros, ligado
			 * horas seguidas — e ninguém se aproxima para ler.
			 *
			 * Três decisões mandam em tudo o que está aqui:
			 *
			 * 1. **A grelha é estável.** Ordenada por número, sempre. Nada muda de lugar durante o
			 *    turno, nem as faltas: quem procura o B47 encontra-o no mesmo sítio da última vez
			 *    que olhou. Um cartão que salta é um cartão que se perde. **Um extra aparece no fim
			 *    e fica lá** — intercalado, empurrava todos os cartões abaixo dele a meio do turno.
			 * 2. **Nunca esconder, nunca paginar.** O que aperta é o tamanho dos cartões, não a
			 *    quantidade. Uma família que não cabe é uma família que não é servida.
			 * 3. **A cor nunca é o único sinal.** A três metros, de lado, e com daltonismo entre os
			 *    voluntários, a cor sozinha não chega. Cada estado leva também forma e símbolo.
			 */
			* {
				box-sizing: border-box;
				margin: 0;
			}

			/*
			 * ---------------------------------------------------------------- a unidade
			 *
			 * **Nenhuma medida deste ficheiro é um píxel do browser. Todas são uma fracção do ecrã.**
			 *
			 * Este painel foi desenhado contra 1920 × 1080 e escrito em píxeis absolutos, o que
			 * parecia a mesma coisa e não é. O televisor do levantamento reporta **960 × 540 px CSS
			 * com `devicePixelRatio: 2`** — 1920 × 1080 físicos contados em metade, que é a densidade
			 * normal de uma Android TV, onde 1 px CSS = 1 dp = 2 px do painel. Não é defeito nem
			 * overscan. Mas com o desenho em píxeis absolutos, tudo saía ao dobro do tamanho previsto
			 * e cabia um quinto dos cartões; os restantes eram cortados em silêncio.
			 *
			 * O `--px` é o antídoto: **um píxel do desenho**, valendo a milésima parte de 1920 da
			 * largura — ou de 1080 da altura, o que for menor, para um ecrã que não seja 16:9 encolher
			 * em vez de cortar. A 1920 px CSS vale 1; a 960 vale 0,5; num 4K que reporte 3840 vale 2.
			 * Em todos, **o resultado no vidro é o mesmo**, que é o que a legibilidade a três metros
			 * pede: o que importa não é o número de píxeis de uma letra, é a fracção do ecrã que ela
			 * ocupa.
			 *
			 * Daí a regra, que não tem excepções neste ficheiro: **um valor em `px` aqui é um erro.**
			 * Escreve-se `calc(40 * var(--px))`, não `40px`. Vale para bordas e para raios de canto
			 * como vale para corpos de letra — uma borda que não encolha com o resto engorda ao dobro
			 * no televisor, e nota-se.
			 *
			 * **Os tokens de espaço são reexpressos aqui, e não no `tokens.css`.** Aquele ficheiro é
			 * partilhado com a PWA, que corre num telemóvel e não quer nada disto; a escala é uma
			 * propriedade desta página, não da marca. Os nomes e os valores são os mesmos do
			 * `design.md` — muda a unidade, não o sistema.
			 */
			:root {
				--px: min(calc(100vw / 1920), calc(100vh / 1080));

				--e-1: calc(4 * var(--px));
				--e-2: calc(8 * var(--px));
				--e-3: calc(12 * var(--px));
				--e-4: calc(16 * var(--px));
				--e-6: calc(24 * var(--px));
				--e-8: calc(32 * var(--px));
				--e-12: calc(48 * var(--px));
				--e-16: calc(64 * var(--px));
				--e-24: calc(96 * var(--px));
			}

			body {
				background: var(--n-950);
				color: var(--n-000);
				font-family: var(--fonte);
				font-weight: 500; /* sobre fundo escuro, o 400 esvai-se a três metros */
				font-size: calc(40 * var(--px));
				line-height: 1.2;
				height: 100vh;
				overflow: hidden;
				display: grid;
				grid-template-rows: auto 1fr auto;
				gap: var(--e-6);
				padding: var(--e-6);
				font-variant-numeric: tabular-nums;
			}

			/* ------------------------------------------------------------- cabeçalho */

			/*
			 * **O cabeçalho tem altura fixa, e é a regra que manda nele.**
			 *
			 * Não é estética: a grelha vive no que sobra, e um cabeçalho que cresça uma linha rouba
			 * uma linha de cartões — que é uma fila de famílias fora do ecrã, sem aviso. Já
			 * aconteceu. Portanto a altura é um número, o conteúdo encolhe ou é cortado dentro dela,
			 * e a grelha recebe sempre o mesmo espaço, com 7 famílias ou com 90.
			 *
			 * Três colunas: o logótipo, as coordenadas da vista, e o que identifica o sítio e a
			 * hora. A navegação fica por baixo da terceira.
			 */
			/*
			 * Quatro colunas, e a ordem não é arbitrária: **o controlo do dia e o do turno ficam nas
			 * pontas**, com a identidade do sítio pelo meio. Encostados um ao outro liam-se como um
			 * só controlo, e as setas do dia pareciam mudar o turno.
			 *
			 * A altura é fixa porque a grelha vive no que sobra: um cabeçalho que cresça uma linha
			 * rouba uma linha de cartões, que são dez famílias fora do ecrã sem aviso.
			 */
			header {
				height: calc(132 * var(--px));
				overflow: hidden;
				display: grid;
				grid-template-columns: auto minmax(0, 1fr) auto auto;
				grid-template-rows: auto auto;
				align-content: center;
				align-items: center;
				column-gap: var(--e-6);
				row-gap: var(--e-1);
				border-bottom: calc(2 * var(--px)) solid var(--n-800);
			}

			/*
			 * O símbolo, sem o lettering.
			 *
			 * O cabeçalho já diz "PT Núcleo <nome>" em texto, e o lockup horizontal repetia a
			 * palavra REFOOD ao lado disso enquanto comia 240px de largura que os cartões usam. O
			 * símbolo diz o mesmo e ocupa um terço.
			 *
			 * **O mínimo de 240px do `design.md` não se aplica aqui:** é a regra da variante
			 * horizontal, e esta não é uma variante — é o símbolo isolado, que o guia da marca não
			 * prevê. A decisão está registada no `design.md`. Dimensiona-se pela altura, para
			 * assentar no cabeçalho, com folga à volta bem acima da largura do próprio traço.
			 */
			/*
			 * Cada filho do cabeçalho leva coluna e linha escritas à mão.
			 *
			 * Sem isso a colocação automática da grelha põe primeiro os itens com linha definida — o
			 * logótipo e o controlo do turno — e o turno saltava para junto do logótipo, que é
			 * exactamente a adjacência que este desenho existe para desfazer.
			 */
			.logotipo {
				grid-column: 1;
				grid-row: 1 / -1;
				height: calc(96 * var(--px));
				width: auto;
				margin-right: var(--e-4);
			}

			.dia-controlo {
				grid-column: 2;
				grid-row: 1;
			}

			.identidade {
				grid-column: 3;
				grid-row: 1 / -1;
			}

			.turno-controlo {
				grid-column: 4;
				grid-row: 1 / -1;
			}

			.contagens {
				grid-column: 2;
				grid-row: 2;
			}

			/* A linha de cima é **sempre uma só linha**, aconteça o que acontecer ao resto. */
			.coordenadas {
				display: flex;
				align-items: baseline;
				gap: var(--e-4);
				min-width: 0;
				white-space: nowrap;
				overflow: hidden;
			}

			.dia {
				font-size: calc(56 * var(--px));
				font-weight: var(--peso-destaque);
			}

			/* Só a primeira letra: `capitalize` dava "Quinta-Feira", e em português é "Quinta-feira". */
			.dia::first-letter {
				text-transform: uppercase;
			}

			/* A relação com hoje é o que impede alguém de ler o ecrã de amanhã como se fosse o de hoje. */
			.relacao {
				font-size: calc(36 * var(--px));
				color: var(--marca-amarelo); /* amarelo sobre escuro: 11,7:1, o acento mais forte que a marca permite */
				font-weight: var(--peso-enfase);
			}

			.contagens {
				font-size: calc(32 * var(--px));
				color: var(--n-400);
				display: flex;
				gap: var(--e-6);
				white-space: nowrap;
				overflow: hidden;
			}

			.contagens b {
				color: var(--n-000);
				font-weight: var(--peso-enfase);
			}

			/*
			 * O peso do turno, no cabeçalho, com a mesma cor de "feito" dos cartões.
			 *
			 * **É a soma exacta dos números que estão nos cartões** — o servidor arredonda cada um e
			 * soma depois, precisamente para que quem somar o ecrã à mão obtenha este valor.
			 */
			.contagens .peso-total b {
				color: var(--ok-claro);
			}

			/*
			 * O aviso de valores fora de escala.
			 *
			 * **Existe para um número absurdo não desaparecer em silêncio.** Um peso acima do tecto de
			 * plausibilidade não entra na soma e não aparece no cartão — mas se também não fosse dito
			 * em sítio nenhum, ninguém o iria corrigir no Odoo. Em cerca de 5% dos dias de entregas e
			 * 0,5% dos de recolhas isto aparece.
			 *
			 * Não é vermelho: não é um erro da operação, é um registo que precisa de ser visto.
			 */
			.contagens .fora-de-escala {
				color: var(--info-claro);
			}

			/*
			 * **O contador de cartões que não cabem no ecrã. Este é vermelho, e a diferença importa.**
			 *
			 * O `fora de escala` ao lado é azul de propósito: é um registo estranho no Odoo, não um
			 * defeito desta app. Este é ao contrário. Se ele aparecer, **o painel está a falhar
			 * naquilo para que existe** — houve famílias que vieram do servidor e não estão em lado
			 * nenhum do ecrã, e quem está na cozinha não tem como saber.
			 *
			 * Existe porque a alternativa já aconteceu: o degrau mais denso estava dimensionado para
			 * 90 famílias, que era uma contagem de antes de o painel deixar de desenhar fichas
			 * arquivadas. Enquanto esse número esteve velho, um turno maior do que o previsto perdia
			 * cartões em silêncio — sem aviso, sem barra de deslocamento, sem nada. Os números de hoje
			 * dizem que não chega lá; os números de ontem também diziam.
			 *
			 * **Não é para o caso normal. É para quando a medição voltar a ficar velha.**
			 */
			.contagens .fora-do-ecra {
				color: var(--erro-claro);
			}

			/*
			 * O contador de extras, e o de encomendas por identificar.
			 *
			 * **Os extras são contados à parte dos previstos, e não somados a eles.** As três
			 * primeiras contagens do cabeçalho descrevem a escala do dia — quantas famílias estavam
			 * previstas, quantas já foram servidas, quantas faltaram —, e é isso que quem está na
			 * cozinha lê para saber quanto falta fazer. Um extra não estava previsto: somá-lo ao
			 * total fazia o denominador mexer-se durante o turno.
			 *
			 * O "por identificar" segue a mesma regra do fora de escala, e pela mesma razão: são
			 * encomendas que aconteceram e que não aparecem em cartão nenhum — quase sempre uma
			 * ficha arquivada —, e uma coisa que desaparece em silêncio é um erro que ninguém
			 * corrige. Em regime está a zero, e por isso o grupo só aparece quando não está.
			 */
			.contagens .extras {
				color: var(--marca-amarelo);
			}

			.contagens .por-identificar {
				color: var(--info-claro);
			}

			/* O sítio e a hora, à direita e numa linha só. O núcleo corta com reticências se for comprido. */
			/*
			 * O sítio e o turno, em duas linhas.
			 *
			 * **O nome do turno está aqui e não no separador** porque o separador só tem a hora, e a
			 * hora não chega para identificar: há núcleos com seis turnos de recolha no mesmo dia, e
			 * dois deles começam ambos às 18:00 — `Turno 2.18` e `Turno 2.18 Hiper`. O que os separa
			 * é o nome, e havia espaço por baixo do núcleo.
			 */
			.identidade {
				display: flex;
				flex-direction: column;
				align-items: flex-end;
				justify-content: center;
				gap: var(--e-1);
				min-width: 0;
				white-space: nowrap;
			}

			.turno-nome {
				font-size: calc(26 * var(--px));
				color: var(--n-600);
				overflow: hidden;
				text-overflow: ellipsis;
				max-width: 100%;
			}

			.nucleo {
				font-size: calc(32 * var(--px));
				color: var(--n-400);
				overflow: hidden;
				text-overflow: ellipsis;
			}

			/*
			 * **A hora a que estamos.** Num ecrã que fica ligado cinco horas seguidas numa cozinha, é
			 * das coisas mais úteis que lá podem estar — e é a única coisa neste painel que muda
			 * sozinha sem ser um dado do Odoo.
			 */
			.agora {
				flex: none;
				margin-left: auto;
				font-size: calc(32 * var(--px));
				font-weight: var(--peso-destaque);
				color: var(--n-400);
			}

			/* --------------------------------------------------------------- navegação */

			/*
			 * **Não há um único elemento focável neste ecrã, e é deliberado.**
			 *
			 * O browser de uma Android TV usa as setas do comando para mover o foco entre elementos
			 * clicáveis. Se aqui houvesse um `<button>`, cada seta faria duas coisas ao mesmo tempo:
			 * a nossa navegação e o salto de foco do browser. Por isso os controlos são `<div>`, que
			 * não entram na navegação por foco, e quem ouve as teclas é a janela.
			 *
			 * O clique continua a funcionar — é como se testa no PC —, mas é o acessório, não o
			 * caminho principal. Este ecrã é para olhar; quem o opera tem um comando na mão.
			 */
			.seta {
				color: var(--n-400);
				line-height: 1;
				user-select: none;
				cursor: pointer;
				transition: color 120ms ease;
			}

			.seta:hover {
				color: var(--n-000);
			}

			.seta[data-inativa='sim'] {
				color: var(--n-800);
				cursor: default;
			}

			/*
			 * **A forma da seta diz qual é o eixo.** Chevrons horizontais mudam o dia, triângulos
			 * verticais mudam o turno — é o mapeamento do comando desenhado no ecrã. Os dois
			 * controlos ficam em pontas opostas do cabeçalho, com o núcleo e o relógio pelo meio:
			 * encostados um ao outro, pareciam um só, e as setas do dia liam-se como do turno.
			 */
			.dia-controlo {
				display: flex;
				align-items: baseline;
				gap: var(--e-4);
				min-width: 0;
				white-space: nowrap;
				overflow: hidden;
			}

			.dia-controlo .seta {
				font-size: calc(48 * var(--px));
			}

			/*
			 * O turno: as setas empilhadas à volta da hora actual, e **não a lista dos turnos**.
			 *
			 * Empilhar a lista era tentador — mostrava tudo — mas em 93 das 134 combinações de
			 * núcleo e dia há **um turno só**, e uma lista de um elemento é um rótulo com ar de menu.
			 * Assim o controlo tem sempre a mesma altura, com um turno ou com três (o máximo medido
			 * na base), e os pontos dizem em qual se está sem ocupar espaço.
			 */
			.turno-controlo {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: var(--e-1);
				min-width: calc(140 * var(--px));
				padding-left: var(--e-6);
			}

			/* Sem etiqueta, `20:00` ao lado de `23:31` são dois relógios e ninguém sabe qual é qual. */
			.turno-etiqueta {
				font-size: calc(18 * var(--px));
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--n-600);
				line-height: 1;
			}

			.turno-controlo .seta {
				font-size: calc(26 * var(--px));
			}

			.turno-hora {
				font-size: calc(40 * var(--px));
				font-weight: var(--peso-destaque);
				color: var(--marca-amarelo); /* sobre escuro são 11,7:1 */
				line-height: 1.1;
			}

			.turno-pontos {
				display: flex;
				gap: calc(7 * var(--px));
				height: calc(12 * var(--px));
				align-items: center;
			}

			.turno-pontos i {
				width: calc(10 * var(--px));
				height: calc(10 * var(--px));
				border-radius: 50%;
				background: var(--n-600); /* --n-800 não se via sobre --n-950 */
			}

			.turno-pontos i[data-actual='sim'] {
				background: var(--marca-amarelo);
			}

			/* Com um turno só não há para onde ir, mas a hora fica: quem entra tem de saber o que vê. */
			.turno-controlo[data-unico='sim'] .seta,
			.turno-controlo[data-unico='sim'] .turno-pontos {
				visibility: hidden;
			}

			/* ------------------------------------------------------------------ corpo */

			/*
			 * A coluna de notas está estreita **enquanto estiver vazia**. O espaço reservado tem de
			 * se ver — senão ninguém repara quando o conteúdo chegar —, mas 300px para mostrar um
			 * travessão é largura tirada aos cartões, que é onde ela faz falta. Alarga quando a PWA
			 * tiver recados para lá pôr.
			 */
			.corpo {
				display: grid;
				min-height: 0;
			}

			/*
			 * **A largura do cartão tem tecto.** Com poucas famílias, esticar as colunas até encher
			 * a linha dava cartões enormes com três palavras lá dentro, e ecrã vazio do lado de lá.
			 * A densidade adaptativa é para dar folga, não para encher: o cartão cresce até ao que a
			 * informação justifica e pára, e a grelha fica centrada no espaço que sobra.
			 */
			.grelha {
				display: grid;
				/*
				 * **A largura sai do máximo das duas linhas, não do número.**
				 *
				 * O número tem 4 caracteres — `B912` —, e a linha de baixo tem 11: `19:30  3A 4C`.
				 * Dimensionar pelo número dava cartões que cortavam a linha de baixo. O
				 * `min-content` é a largura da linha mais larga que não quebra, portanto o cartão
				 * nunca fica mais estreito do que o seu conteúdo; o `--largura` é só o tecto.
				 */
				grid-template-columns: repeat(var(--colunas, 6), minmax(min-content, var(--largura, calc(240 * var(--px)))));
				justify-content: center;
				gap: var(--folga, calc(12 * var(--px)));
				align-content: start;
				min-height: 0;
			}

			/*
			 * **Cada área qualifica os seus degraus, e não é arrumação.**
			 *
			 * Estes blocos eram `.grelha[data-densidade='normal']`, sem a área, e os das recolhas
			 * ganhavam-lhes só por serem mais específicos. Funcionava enquanto as duas áreas tivessem
			 * os mesmos quatro degraus. Deixou de funcionar no dia em que as recolhas passaram a ter
			 * dois: um `data-densidade="apertada"` numa grelha de recolhas apanhava silenciosamente as
			 * medidas das **entregas**. E qualquer variável que uma área acrescentasse e a outra não
			 * sobrepusesse — um `--barra`, um `--entre` — atravessava para o lado de lá sem aviso.
			 *
			 * Com a área no selector, o que é de uma área fica na área.
			 */

			/*
			 * A densidade é escolhida pela contagem, não pelo espaço disponível: com 20 famílias o
			 * ecrã respira, com 90 aperta. Degraus e não um cálculo contínuo, para que a grelha não
			 * mude de forma por causa de uma família a mais.
			 *
			 * **Nada é escondido em degrau nenhum.** O que encolhe é o tamanho; o número, a hora e
			 * as pessoas estão sempre lá. Esconder a hora seria o mesmo que paginar: quem está na
			 * cozinha deixava de ter no ecrã uma coisa de que precisa, e não saberia que faltava.
			 *
			 * No degrau mais apertado o secundário desce aos 24, abaixo do chão de 32 do
			 * `design.md`. É uma cedência consciente e está anotada no resumo de decisões: com 90
			 * famílias num 1080p não cabem as duas coisas, e a alternativa era esconder dados.
			 *
			 * ---------------------------------------------------------------------------------
			 *
			 * **Três números por degrau, e os três têm de bater certo com a realidade. Há um teste.**
			 *
			 * `apps/tv/test/degraus.test.ts` carrega esta página num browser, constrói cartões com
			 * as funções daqui de baixo e mede-os. Compara três coisas, e cada uma já esteve errada
			 * aqui sem que nada desse sinal:
			 *
			 * 1. **`--largura` ≥ largura mínima do cartão.** O tecto tem de aguentar o cartão que o
			 *    painel promete mostrar. Abaixo disso a faixa não encolhe — **transborda**, e como a
			 *    grelha é centrada dentro de um `overflow: hidden`, os cartões saem pelos dois lados
			 *    ao mesmo tempo, sem nada no ecrã a dizê-lo. O `cheia` esteve com tecto de 180 para
			 *    um cartão de 186,5.
			 * 2. **`colunas × --largura` + folgas ≤ largura da grelha** (1 872 do desenho). As
			 *    recolhas declaravam 5 × 372 = 1 908. Nunca se viu, porque as faixas encolhem até ao
			 *    conteúdo antes de chegarem ao tecto — mas um tecto inalcançável é um número que
			 *    mente a quem o ler a seguir.
			 * 3. **O corte da contagem ≤ lugares que o degrau tem.** É o corte da função
			 *    `densidade()`, e o `apertada` das entregas apanhava até 72 num degrau de 9 × 7 = 63.
			 *
			 * **Por isso é que o cartão tem `--barra` e `--entre`**, e não uma borda e um espaço
			 * fixos: os últimos seis píxeis que faltavam ao `cheia` para caberem os 90 saíram daí.
			 * Uma medida deste cartão que viva fora da densidade volta a partir isto.
			 */
			.grelha[data-area='entregas'][data-densidade='folgada'] {
				--colunas: 5;
				--largura: calc(300 * var(--px));
				--numero: calc(64 * var(--px));
				--kg: calc(42 * var(--px));
				--detalhe: calc(32 * var(--px));
			}
			/*
			 * **Seis colunas, e não sete, pela mesma razão que o `cheia` tem oito.**
			 *
			 * A sete, a coluna tinha 257px para um cartão que no pior caso mede 282 — etiqueta de
			 * cinco caracteres, peso de três dígitos, contagens de dois. Um núcleo cuja numeração
			 * passe dos mil serrava a coluna da direita em 40% dos ecrãs, que é a fatia que este
			 * degrau serve. A seis são 302px, com 20 de margem.
			 *
			 * Custa lugares: 6 × 6 = 36, contra os 42 de antes. O corte da `densidade()` acompanhou.
			 */
			.grelha[data-area='entregas'][data-densidade='normal'] {
				--colunas: 6;
				--largura: calc(302 * var(--px));
				--barra: calc(10 * var(--px));
				--entre: calc(6 * var(--px));
				--numero: calc(52 * var(--px));
				--kg: calc(32 * var(--px));
				--detalhe: calc(28 * var(--px));
				--respiro-h: calc(8 * var(--px));
			}
			/*
			 * **Sete colunas, e não nove.** A nove, a coluna tinha 201px para um cartão de 245 no pior
			 * caso. A sete são 260, com 16 de margem. Passa de 63 lugares para 49, e o que sobra vai
			 * para o `cheia`, que tem 72 — mais do que o maior turno da base, que tem 65.
			 */
			.grelha[data-area='entregas'][data-densidade='apertada'] {
				--colunas: 7;
				--largura: calc(260 * var(--px));
				--barra: calc(8 * var(--px));
				--entre: calc(6 * var(--px));
				--numero: calc(44 * var(--px));
				--kg: calc(28 * var(--px));
				--detalhe: calc(24 * var(--px));
				--folga: calc(8 * var(--px));
				--respiro: calc(6 * var(--px));
				--respiro-h: calc(8 * var(--px));
			}
			/*
			 * **Oito colunas, e não dez, porque as dez eram para 90 famílias que não existem.**
			 *
			 * O 90 que dimensionava este degrau saiu de uma contagem feita **antes** de o painel
			 * deixar de desenhar fichas arquivadas. Contando as arquivadas, o maior turno da base tem
			 * 94; contando o que um ecrã mostra, tem **65**. Medido com o
			 * `scripts/turnos-por-tamanho.ts` em Setembro de 2026: 178 ecrãs, mediana 14, e nenhum
			 * acima de 65 — 1,1% passam sequer dos 63.
			 *
			 * Oito por nove linhas dão 72 lugares, com folga sobre os 65. E dão à coluna **227px em
			 * vez de 180**, que é o que faz caber um cartão com etiqueta de cinco caracteres (200px)
			 * e mesmo o pior caso com peso de três dígitos (216px). Com dez, o primeiro núcleo cuja
			 * numeração passasse dos mil via a coluna da direita serrada ao meio em todas as filas:
			 * a grelha ia a 2 075px numa faixa de 1 872. Já há 47 cartões assim na base, e o maior
			 * contador vai em 1574.
			 *
			 * Sete colunas dariam 260px, mas só 63 lugares — abaixo dos 65 que existem.
			 */
			.grelha[data-area='entregas'][data-densidade='cheia'] {
				--colunas: 8;
				--largura: calc(227 * var(--px));
				/*
				 * A barra e o espaço interno ficam um pouco abaixo do normal — não pelos 6px que o
				 * degrau de dez colunas precisava, mas para o **pior caso** caber com margem: etiqueta
				 * de cinco caracteres, peso de três dígitos e contagens de dois dá um cartão de 224px
				 * nos 227 que a coluna tem. Sem isto ficava a 0,8px de estourar, e um cartão cortado a
				 * 3px acende o contador de "fora do ecrã" sem que haja nada de errado.
				 */
				--barra: calc(10 * var(--px));
				--entre: calc(6 * var(--px));
				--numero: calc(40 * var(--px)); /* o mínimo absoluto do `design.md` para um televisor */
				--kg: calc(24 * var(--px));
				--detalhe: calc(20 * var(--px)); /* abaixo do chão de 32px: ver a nota acima */
				--folga: calc(8 * var(--px));
				--respiro: calc(4 * var(--px));
				--respiro-h: calc(8 * var(--px));
			}

			/* --------------------------------------------------- densidade das recolhas */

			/*
			 * As recolhas têm menos cartões — o maior turno da base tem 29 fontes, contra 90 famílias
			 * — mas cada cartão é muito mais largo, porque leva o **nome** ao lado do número.
			 *
			 * O nome mais comprido da base tem **55 caracteres**: *"Supermercado Continente - Bom Dia
			 * - Gândara dos Olivais"*. Não é caso raro de laboratório: 48% passam os 20 caracteres e
			 * 13% passam os 30. É o nome, e não o número, que dita a largura da coluna.
			 */
			/*
			 * **A altura da linha é fixa, não sai do conteúdo.**
			 *
			 * Com nomes de comprimento muito diferente — de 3 a 55 caracteres —, deixar a linha
			 * crescer com o cartão mais alto empurrava as últimas linhas para fora do ecrã. Fixa, um
			 * cartão impossível transborda a si próprio, à vista, em vez de esconder uma fila
			 * inteira de fontes.
			 */
			/*
			 * **A linha tem a altura do conteúdo, com tecto.**
			 *
			 * Fixá-la punha o cartão a reservar espaço que muitas vezes não usava: com um nome de
			 * uma linha só, sobrava um vazio a separar o nome da hora — que se lia como um erro de
			 * alinhamento e não como folga. Agora a linha encolhe até ao conteúdo, e o `--altura` é
			 * o limite que impede uma fila de cartões de sair do ecrã.
			 *
			 * A sobra vai para baixo da grelha, onde não se vê, em vez de ficar dentro dos cartões.
			 */
			.grelha[data-area='recolhas'] {
				grid-auto-rows: min-content;
			}

			/*
			 * Os cartões de recolha: altura limitada, e o conteúdo empacotado a partir de cima.
			 *
			 * A hora vem **logo depois do nome**, não encostada ao fundo. Encostadas ao fundo
			 * alinhavam entre cartões da mesma linha, o que era bonito — mas com um nome curto abria
			 * um vazio no meio do cartão, e um vazio no meio lê-se como coisa que falta.
			 *
			 * **Está preso à área e não ao estado**, e a diferença acabou por importar: era uma lista
			 * de dois estados — `por_recolher` e `recolhido` —, que descrevia "todos os cartões de
			 * recolha" por serem os únicos que havia. Ao passar a existir `falta` nas recolhas, essa
			 * lista deixava um cartão de fora e o conteúdo dele espalhava-se. É o que uma regra de
			 * layout escrita como se fosse regra de estado faz quando o estado cresce.
			 */
			.grelha[data-area='recolhas'] .cartao {
				max-height: var(--altura, calc(124 * var(--px)));
				align-content: start;
			}

			.grelha[data-area='recolhas'][data-densidade='folgada'] {
				--colunas: 3;
				--largura: calc(600 * var(--px));
				--altura: calc(190 * var(--px));
				--nome: calc(34 * var(--px));
				--kg: calc(42 * var(--px));
				--detalhe: calc(26 * var(--px));
			}
			.grelha[data-area='recolhas'][data-densidade='normal'] {
				--colunas: 5;
				--largura: calc(364 * var(--px));
				--altura: calc(124 * var(--px)); /* 30 fontes ÷ 5 = 6 linhas */
				--nome: calc(26 * var(--px));
				--kg: calc(32 * var(--px));
				--detalhe: calc(21 * var(--px));
			}
			/*
			 * **As recolhas têm dois degraus, e não quatro. Os outros dois nunca aconteceram.**
			 *
			 * Havia aqui um `apertada` (6 colunas, até 42 fontes) e um `cheia` (7 colunas, até 70).
			 * Medido sobre a base com o `scripts/turnos-por-tamanho.ts`, em Setembro de 2026: 154
			 * ecrãs de recolhas, **máximo de 26 fontes**, 94% deles com 12 ou menos. **Zero ecrãs
			 * chegavam ao `apertada`**, quanto mais ao `cheia`.
			 *
			 * Eram dois blocos de medidas que nunca foram desenhados num televisor, nunca foram
			 * vistos por ninguém, e à mesma tinham de ser mantidos a par do resto — o `cheia` das
			 * recolhas declarava um tecto que não cabia na largura da grelha, e ninguém deu por isso
			 * em meses, porque não havia como dar. Código que nunca corre é código que ninguém testa.
			 *
			 * O `normal` passou a não ter tecto de contagem: apanha tudo o que passe de 12. Tem 5 × 6
			 * = 30 lugares para um máximo observado de 26, e **é o aviso de "fora do ecrã" que guarda
			 * essa folga** — ver o `contarForaDoEcra()`. Se um núcleo crescer, aparece no cabeçalho em
			 * vez de desaparecer em silêncio.
			 */

			/* ---------------------------------------------------------------- cartões */

			/*
			 * **O estado é uma dimensão do cartão, não um caso especial.**
			 *
			 * Toda a aparência do estado sai de três variáveis — a cor, o símbolo e se preenche —,
			 * e o bloco de cada estado é o único sítio onde elas se escrevem. Acrescentar o quarto
			 * estado ("à espera", quando a PWA registar quem chegou) é acrescentar um bloco destes:
			 * uma cor nova, um símbolo, e mais nada. Nenhuma regra de desenho tem de saber que ele
			 * existe.
			 */
			.cartao {
				--cor: var(--n-400);
				--marca: '';
				--fundo: transparent;

				background: var(--fundo);
				border: calc(3 * var(--px)) solid var(--cor);
				/*
				 * A barra grossa lê-se de longe mesmo sem se distinguir a cor — e **encolhe com o
				 * degrau**, como todo o resto do cartão. Fixa nos 12, era 6,7% da largura de um
				 * cartão do degrau `cheia` gasta em moldura, num degrau onde faltavam 6px para os
				 * cartões caberem no ecrã. Ver a nota dos tectos, na densidade.
				 */
				border-left-width: var(--barra, calc(12 * var(--px)));
				border-radius: calc(8 * var(--px));
				padding: var(--respiro, calc(8 * var(--px))) var(--respiro-h, calc(12 * var(--px)));
				display: grid;
				grid-template-columns: 1fr auto;
				align-items: center;
				/*
				 * O `--entre` é a distância do identificador aos quilos, e é a terceira medida que
				 * vivia fora da densidade: `var(--e-2)` são 8px tanto ao lado de um número de 64px
				 * como de um de 40px.
				 */
				gap: var(--e-1) var(--entre, var(--e-2));
				/*
				 * Sem `overflow: hidden` e **sem `min-width: 0`**. Os dois cortam texto em silêncio,
				 * e o segundo era o que anulava o `min-content` da grelha: com ele, o cartão podia
				 * encolher abaixo do seu próprio conteúdo e comia o "C" do "12A 10C". Um cartão que
				 * corta texto está mal dimensionado, e quer-se ver isso a transbordar num ecrã de
				 * teste, não descobri-lo numa cozinha.
				 */
			}

			.cartao[data-estado='por_entregar'] {
				--cor: var(--n-400);
				--marca: '·';
			}

			.cartao[data-estado='entregue'] {
				--cor: var(--ok-claro);
				--marca: '✓';
				--fundo: color-mix(in srgb, var(--ok-claro) 14%, transparent);
			}

			.cartao[data-estado='falta'] {
				--cor: var(--erro-claro);
				--marca: '✕';
				--fundo: color-mix(in srgb, var(--erro-claro) 14%, transparent);
				border-style: dashed;
				border-left-style: solid;
			}

			/* O quarto estado entra aqui, e é só isto:
			.cartao[data-estado='a_espera'] {
				--cor: var(--info-claro);
				--marca: '◔';
				--fundo: color-mix(in srgb, var(--info-claro) 14%, transparent);
			} */

			/*
			 * As recolhas têm três estados: por recolher, recolhido e falta.
			 *
			 * Dizia aqui "não há faltas — uma fonte que não tinha excedentes não é uma falta de
			 * ninguém", e a segunda metade continua verdadeira: o "sem excedente" tem produto próprio
			 * no POS e conta como **recolhido**. Mas faltas há, e havia antes de alguém dar por isso —
			 * 25 na base desde 2024-10-31, que este painel mostrava com o visto verde.
			 *
			 * O `falta` não precisa de bloco próprio: o das entregas não está preso a área nenhuma.
			 */
			.cartao[data-estado='por_recolher'] {
				--cor: var(--n-400);
				--marca: '·';
			}

			.cartao[data-estado='recolhido'] {
				--cor: var(--ok-claro);
				--marca: '✓';
				--fundo: color-mix(in srgb, var(--ok-claro) 14%, transparent);
			}

			/*
			 * **O número e o nome são um identificador só**, na mesma linha e do mesmo tamanho, com o
			 * número a bold. Há quem conheça a fonte pelo número e quem a conheça só pelo nome; o
			 * nome não é legenda, é o segundo eixo de leitura e tem de se ler de longe.
			 *
			 * **Nunca se corta com reticências.** Sete fontes da base começam por "Continente Bom
			 * Dia…" e o que as distingue está no fim — cortar aos 18 caracteres deixava 23 nomes
			 * ambíguos. Quando não cabe, o que encolhe é o corpo da letra, e o nome vai inteiro.
			 */
			/* Fica na coluna 1, com a marca de estado ao lado — não em cima dela, que gastava uma linha. */
			.identificador {
				grid-column: 1;
				font-size: var(--nome, calc(26 * var(--px)));
				line-height: 1.15;
				overflow-wrap: break-word;
				align-self: start;
			}

			/*
			 * O número a amarelo, no peso corrente.
			 *
			 * A bold, o número puxava o olho para si e o nome ficava a parecer legenda — e são os
			 * dois o identificador. A cor separa-os sem os hierarquizar, e o amarelo sobre escuro
			 * tem 11,7:1, que é o acento mais forte que a marca permite.
			 */
			.identificador b {
				font-weight: inherit;
				color: var(--marca-amarelo);
			}

			/*
			 * Os degraus do nome, pelo comprimento. Medido na base: 75% cabem no tamanho de base,
			 * 22% precisam de um degrau, 3% de dois. O último degrau existe para o caso que ainda não
			 * apareceu — vale mais um nome pequeno do que um nome cortado.
			 */
			.identificador[data-longo='1'] {
				font-size: calc(var(--nome, calc(26 * var(--px))) * 0.88);
			}
			.identificador[data-longo='2'] {
				font-size: calc(var(--nome, calc(26 * var(--px))) * 0.78);
			}
			.identificador[data-longo='3'] {
				font-size: calc(var(--nome, calc(26 * var(--px))) * 0.68);
			}

			.numero {
				font-size: var(--numero, calc(64 * var(--px)));
				font-weight: var(--peso-destaque);
				line-height: 1;
				white-space: nowrap;
			}

			/* Sem número não se inventa um: a família continua na grelha, com o lugar dela. */
			.numero[data-sem-numero='sim'] {
				color: var(--n-400);
			}

			.marca {
				font-size: var(--numero, calc(64 * var(--px)));
				line-height: 1;
				color: var(--cor);
			}

			.marca::after {
				content: var(--marca);
			}

			/*
			 * **O peso ocupa o lugar do visto, e leva a cor do estado.**
			 *
			 * Não é uma segunda informação encostada ao ✓: é o ✓ substituído por um número. Quem
			 * entregou 15 kg tem o cartão a dizer "15 kg" a verde, e quem entregou sem peso registado
			 * continua a ter o visto — são 1,2% dos cartões, e para esses o glifo é a única resposta
			 * que existe.
			 *
			 * **A distinção não é só de cor.** Um ✕ vermelho e um "15 kg" verde diferem em *forma*
			 * antes de diferirem em cor, e por isso quem não distingue verde de vermelho continua a
			 * ler o cartão. Era diferente se fossem dois números.
			 *
			 * Alinhado à direita e sem `wrap`: o número cresce para a esquerda e nunca parte em duas
			 * linhas.
			 *
			 * **O corpo é o `--kg`, e é o mesmo em qualquer cartão** — família, fonte ou parceiro de
			 * apoio, entrega programada ou extra. Quem olha para um ecrã lê os quilos como uma só
			 * grandeza, e um mesmo número que aparecesse maior num cartão do que noutro sugeria uma
			 * diferença que não existe.
			 *
			 * **Tem variável própria, e essa é a correcção.** O peso já saiu duas vezes ao lado por
			 * ser derivado do identificador de cada área — do `--numero` das entregas, que o punha a
			 * 64px numa coluna que não tem essa largura, e depois do `--nome` das recolhas, que
			 * simplesmente não existe do lado das entregas. O tamanho dos quilos não é função do
			 * tamanho do identificador; é uma decisão sua, e agora tem onde ser escrita.
			 *
			 * Escala com a densidade — 42/32/28/24 — porque a densidade é propriedade da grelha e não
			 * do cartão. O valor é o mesmo degrau a degrau nas duas áreas: os quatro números estão
			 * nos blocos de densidade, lado a lado com as outras medidas que ali se decidem.
			 *
			 * **Continua a ser o elemento mais forte do cartão**, porque é o único a bold e a cores;
			 * deixa é de competir com o identificador, que é quem manda na coluna 1.
			 */
			.peso {
				font-size: var(--kg, calc(32 * var(--px)));
				font-weight: var(--peso-destaque);
				line-height: 1;
				color: var(--cor);
				white-space: nowrap;
				text-align: right;
			}

			/*
			 * A unidade a 40% do corpo, e **proporcional em todos os degraus**.
			 *
			 * O que se lê a quatro metros é o número; a unidade serve para desfazer a dúvida de quem
			 * está perto. Um chão em pixéis fazia-a crescer relativamente nos degraus apertados — 16px
			 * ao lado de um número de 24px é a unidade a competir com o número, que é o contrário do
			 * que se quer.
			 *
			 * **O que isto aceita:** no degrau mais cheio a unidade fica com ~9,6px — nas duas áreas,
			 * agora que o corpo é o mesmo —, e a essa distância não se distingue `kg` de `T`. Um
			 * cartão em toneladas exige 1 000 kg num destino só, o que na base são **5 cartões em
			 * 6 092** — e nesses o número em si já é inconfundível (`1,2` contra `125`). Se algum dia
			 * incomodar num ecrã real, o sítio de mexer é aqui.
			 */
			.peso small {
				font-size: 0.4em;
				font-weight: var(--peso-corrente);
				margin-left: 0.15em;
			}

			/*
			 * **O espaço entre a hora e as pessoas é proporcional à letra, e não um token fixo.**
			 *
			 * Era `var(--e-4)` — 16px em todos os degraus. Num cartão folgado, ao lado de letra de
			 * 32px, é a folga certa; no degrau `cheia`, ao lado de letra de 20px, são 80% do corpo,
			 * e essa linha é **a que decide a largura mínima do cartão inteiro**, porque não quebra.
			 * Custava 8px de `min-content` no degrau onde não há 8px para dar.
			 *
			 * É o mesmo defeito que os tectos dos degraus tinham, na sua terceira aparição: uma
			 * medida a viver fora do sistema de densidade, a crescer contra um limite que ninguém
			 * verificava. Agora acompanha o corpo da letra, como tudo o resto no cartão.
			 */
			.detalhe {
				grid-column: 1 / -1;
				font-size: var(--detalhe, calc(32 * var(--px)));
				color: var(--n-400);
				display: flex;
				gap: 0.4em;
				white-space: nowrap;
			}

			/* O travessão de "sem contagem". Cinzento para não se confundir com um número. */
			.sem-contagem {
				color: var(--n-600);
			}

			/*
			 * ------------------------------------------------------------------ extras
			 *
			 * **Um extra não é um estado, e por isso não tem cor própria.**
			 *
			 * Um cartão de extra está *entregue* ou com *falta* como qualquer outro — o verde e o
			 * vermelho continuam a querer dizer o mesmo, e trocá-los por uma terceira cor obrigava a
			 * quem olha a aprender que ali o verde deixou de ser verde.
			 *
			 * **O que o marca é a barra da esquerda, e mais nada.** A barra grossa é o que já se lê
			 * de longe em qualquer cartão; a ponteada é a mesma barra com outra textura, e distingue
			 * sem gastar cor, sem gastar espaço e sem competir com o estado. Chegou a haver ali a
			 * palavra *EXTRA*, no lugar da hora: dizia o mesmo duas vezes e tirava a linha ao nome do
			 * parceiro, que é quem precisa dela.
			 *
			 * O que isto aceita: nas recolhas há cartões sem hora por horário por preencher — 19
			 * rotas em 801 —, e a essa distância o que os separa de um extra é só a textura da barra.
			 * É pouco, e é suficiente porque um extra é raro e o cartão fica no fim da grelha.
			 */
			.cartao[data-extra='sim'] {
				border-left-style: dotted;
			}

			/*
			 * **Um extra não tem tamanho de peso próprio, e é de propósito.** Houve aqui uma regra
			 * a encolher os quilos só nos extras, e estava errada pelo motivo certo: o que estava
			 * grande de mais não era o extra, era o peso das entregas todas. Corrigiu-se onde o
			 * problema estava — no `.peso`, agora com `--kg` —, e este caso especial desapareceu.
			 */

			/* ----------------------------------------------------------- notas (PWA) */

			/*
			 * As notas são uma **faixa no rodapé**, e não uma coluna.
			 *
			 * Como coluna custavam 300px de largura — que a 90 famílias são duas colunas de cartões,
			 * ou seja dezoito famílias fora do ecrã. No rodapé custam 56px de altura, e altura é o
			 * que menos falta faz: no degrau mais cheio sobram uns pixéis, na largura não sobra nada.
			 *
			 * **A faixa só existe quando há notas.** Sem elas não ocupa nada e a grelha fica com o
			 * ecrã inteiro, que é o estado de hoje.
			 *
			 * O texto rola da direita para a esquerda, como nos rodapés dos canais de notícias: é a
			 * forma de caber texto de comprimento imprevisível numa altura fixa sem o encolher nem o
			 * cortar. A duração da volta é proporcional ao comprimento, para a velocidade de leitura
			 * ser sempre a mesma — e é escrita pelo JavaScript numa variável, não fixada aqui.
			 */
			.rodape {
				border-top: calc(2 * var(--px)) solid var(--n-800);
				height: calc(48 * var(--px));
				display: flex;
				align-items: center;
				gap: var(--e-8);
				overflow: hidden;
			}

			/*
			 * A legenda do comando. Discreta: é referência, não é conteúdo — quem está a trabalhar
			 * olha para os cartões, e só olha para aqui na primeira vez que pega no comando.
			 */
			/*
			 * A legenda tem um limite à direita, e não é enfeite.
			 *
			 * Sem ele, a última palavra da legenda encostava ao início das notas e lia-se como o
			 * princípio de uma nota — aconteceu a quem olhou para o ecrã pela primeira vez. São duas
			 * coisas de natureza diferente: uma é referência fixa, a outra é conteúdo que muda.
			 */
			.comandos {
				flex: none;
				display: flex;
				align-items: center;
				gap: var(--e-6);
				padding-right: var(--e-8);
				border-right: calc(2 * var(--px)) solid var(--n-800);
				font-size: calc(22 * var(--px));
				color: var(--n-600);
				white-space: nowrap;
				user-select: none;
			}

			.comando {
				display: flex;
				align-items: center;
				gap: var(--e-2);
				cursor: pointer;
			}

			.comando i {
				font-style: normal;
				color: var(--n-400);
				border: calc(1 * var(--px)) solid var(--n-800);
				border-radius: calc(4 * var(--px));
				padding: calc(1 * var(--px)) calc(8 * var(--px));
			}

			/* O que ainda não existe diz que ainda não existe, em vez de abrir um ecrã vazio. */
			.por-vir {
				opacity: 0.55;
				cursor: default;
			}

			/* Entre parênteses, para não se ler como a continuação da frase nem como uma nota. */
			.por-vir em {
				font-style: normal;
				font-size: calc(18 * var(--px));
			}

			.por-vir em::before {
				content: '(';
			}

			.por-vir em::after {
				content: ')';
			}

			.rodape-etiqueta {
				flex: none;
				font-size: calc(24 * var(--px));
				font-weight: var(--peso-enfase);
				color: var(--marca-preto);
				background: var(--marca-amarelo); /* sobre amarelo o texto é preto, nunca branco */
				padding: var(--e-1) var(--e-3);
				border-radius: calc(4 * var(--px));
				text-transform: uppercase;
				letter-spacing: 0.08em;
			}

			.rodape-janela {
				flex: 1;
				min-width: 0;
				display: flex;
				align-items: center;
				gap: var(--e-4);
				overflow: hidden;
			}

			/*
			 * O carrossel tem o conteúdo **duas vezes** e desliza meia largura: quando a primeira
			 * cópia sai à esquerda, a segunda está exactamente onde a primeira começou, e a volta
			 * não tem costura nem salto.
			 */
			.rodape-fita {
				display: flex;
				width: max-content;
				gap: var(--e-16);
				font-size: calc(28 * var(--px));
				white-space: nowrap;
				animation: rolar var(--duracao, 40s) linear infinite;
			}

			.rodape-fita > span {
				display: flex;
				gap: var(--e-16);
			}

			@keyframes rolar {
				from {
					transform: translateX(0);
				}
				to {
					transform: translateX(-50%);
				}
			}

			/*
			 * Movimento é uma escolha de acessibilidade, não um efeito. Quem tiver o sistema a pedir
			 * menos movimento vê a fita parada, e lê-a como uma linha normal.
			 */
			@media (prefers-reduced-motion: reduce) {
				.rodape-fita {
					animation: none;
				}
			}

			/* ------------------------------------------------------------------ avisos */

			.aviso {
				font-size: calc(40 * var(--px));
				color: var(--erro-claro);
				padding: var(--e-6) 0;
			}

			.vazio {
				font-size: calc(40 * var(--px));
				color: var(--n-400);
				padding: var(--e-12) 0;
			}

			[hidden] {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<header>
			<img class="logotipo" src="/img/refood_simbolo_fundo_escuro.svg" width="169" height="218" alt="Refood" />

			<div class="dia-controlo">
				<span class="seta" id="dia-anterior">‹</span>
				<span class="dia" id="dia">—</span>
				<span class="relacao" id="relacao"></span>
				<span class="seta" id="dia-seguinte">›</span>
			</div>
			<div class="identidade">
				<span class="nucleo" id="nucleo"></span>
				<span class="turno-nome" id="turno-nome"></span>
			</div>
			<div class="turno-controlo" id="turno-controlo">
				<span class="seta" id="turno-anterior">▲</span>
				<span class="turno-etiqueta">turno</span>
				<span class="turno-hora" id="turno-hora">—</span>
				<span class="turno-pontos" id="turno-pontos"></span>
				<span class="seta" id="turno-seguinte">▼</span>
			</div>

			<div class="contagens" id="contagens" hidden>
				<span><b id="conta-total">0</b> <span id="conta-total-rotulo">famílias</span></span>
				<span><b id="conta-feitas">0</b> <span id="conta-feitas-rotulo">entregues</span></span>
				<span id="conta-faltas-grupo"><b id="conta-faltas">0</b> faltas</span>
				<span class="extras" id="conta-extras-grupo" hidden><b id="conta-extras">0</b> <span id="conta-extras-rotulo">extra</span></span>
				<span class="peso-total" id="peso-total-grupo" hidden><b id="peso-total">0</b></span>
				<span class="fora-de-escala" id="fora-de-escala-grupo" hidden><b id="fora-de-escala">0</b> fora de escala</span>
				<span class="por-identificar" id="por-identificar-grupo" hidden><b id="por-identificar">0</b> por identificar</span>
				<span class="fora-do-ecra" id="fora-do-ecra-grupo" hidden><b id="fora-do-ecra">0</b> fora do ecrã</span>
			</div>
		</header>

		<div class="corpo">
			<div>
				<div class="grelha" id="grelha" data-area="entregas" data-densidade="normal"></div>
				<p class="vazio" id="vazio" hidden>Sem entregas neste turno.</p>
				<p class="aviso" id="aviso" role="status" aria-live="polite" hidden></p>
			</div>
		</div>

		<!-- Só aparece quando houver notas. Sem elas, a grelha fica com o ecrã inteiro. -->
		<!--
			O rodapé tem sempre os comandos e, quando houver, as notas a rolar à direita.

			Os comandos são a legenda do mapeamento: quem entra na cozinha e pega no comando vê ali
			o que cada seta faz, sem ninguém lhe explicar. É discreto de propósito — é referência,
			não é o conteúdo.
		-->
		<footer class="rodape">
			<div class="comandos">
				<span class="comando"><i>‹ ›</i> dia</span>
				<span class="comando"><i>▲ ▼</i> turno</span>
				<span class="comando" id="comando-area"><i>OK</i> recolhas</span>
			</div>
			<div class="rodape-janela" id="rodape-notas" hidden>
				<span class="rodape-etiqueta">Notas</span>
				<div class="rodape-fita" id="rodape-fita"></div>
			</div>
			<!--
				O relógio veio parar aqui, e não ao cabeçalho: lá ficava encostado à hora do turno,
				e dois relógios lado a lado sem etiqueta não se distinguem — quem olha não sabe qual
				é "agora" e qual é "o turno que estou a ver".
			-->
			<span class="agora" id="agora">--:--</span>
		</footer>

		<script>
			/*
			 * O painel do lado do ecrã.
			 *
			 * **Nada muda sozinho, nunca** — a não ser os dados do turno que está a ser mostrado.
			 * A distinção é o desenho todo: o dia e o turno ficam onde a pessoa os deixou, porque
			 * estar em "amanhã" é o estado de trabalho de quem está a preparar, e um ecrã que
			 * voltasse a hoje ao fim de uns minutos apagava esse trabalho. Os estados dos cartões,
			 * esses, têm de acompanhar o turno a decorrer, senão o ecrã está a mentir.
			 *
			 * Um só temporizador, como no ecrã de emparelhamento: uma TV fica ligada semanas
			 * seguidas, e dois ciclos a arrancarem-se um ao outro não dão erro nenhum — dão o dobro
			 * dos pedidos, e depois o quádruplo.
			 */

			const TOKEN = 'refood.tv.token';
			/*
			 * De quanto em quanto tempo o painel volta a pedir os dados.
			 *
			 * Sessenta segundos e não trinta: o que muda durante um turno é o estado do POS, e uma
			 * família servida aparecer até um minuto depois não muda nada para quem está na cozinha.
			 * Trinta segundos custavam o dobro das idas ao Odoo — 65 ecrãs, cinco horas por dia,
			 * numa base on-premise — sem ninguém ver a diferença.
			 *
			 * **Isto pede só o painel que está no ecrã.** Quando as Recolhas existirem, o painel
			 * escondido não refresca: alternar com o OK é que o vai buscar.
			 */
			const ACTUALIZACAO_MS = 60_000;

			/**
			 * Quanto tempo um pedido tem para responder antes de se desistir dele.
			 *
			 * **Um `fetch` pendurado não rejeita nunca.** Não é o caso da rede em baixo — esse rejeita e
			 * está tratado desde sempre. É o do wi-fi fraco de uma cozinha, do portal cativo, do proxy
			 * que aceita a ligação e depois emudece: a promessa fica viva para sempre, e com ela fica
			 * tudo o que a esperava. Foi assim que o arranque do painel quase ficou com um ecrã em
			 * branco sem relógio e sem nova tentativa.
			 *
			 * Quinze segundos, porque o painel refresca de 60 em 60: uma leitura que demore mais do que
			 * um quarto do intervalo já não serve para nada, e desistir dela deixa o ciclo seguinte
			 * tentar com a rede que houver nessa altura. O ecrã não fica vazio à espera — fica com o
			 * que tinha, que é o comportamento que já existia para a falta de rede.
			 */
			const PRAZO_DO_PEDIDO_MS = 15_000;

			/**
			 * E o prazo curto do arranque, que é outra coisa.
			 *
			 * O de cima é um limite de transporte: existe para uma ligação pendurada não pendurar o
			 * resto. Este é um limite de **paciência**: a configuração do ecrã é dispensável, e esperar
			 * quinze segundos por ela antes de desenhar o primeiro painel seria pagar por algo que se
			 * resolve com uma tecla do comando. Quatro segundos, e segue-se.
			 */
			const PRAZO_DA_CONFIGURACAO_MS = 4000;
			const RECUO_MS = 60_000;

			/** Onde o ecrã está. Só muda por acção de quem carrega numa seta. */
			let dia = null;
			let turno = null;

			/** Os turnos do dia que está no ecrã, para as setas de cima e de baixo saberem por onde andar. */
			let turnosDoDia = [];

			let proximaLeitura = 0;
			let aPedir = false;

			const el = (id) => document.getElementById(id);

			function avisar(texto) {
				el('aviso').textContent = texto ?? '';
				el('aviso').hidden = !texto;
			}

			async function pedir(caminho, prazoMs = PRAZO_DO_PEDIDO_MS) {
				const token = localStorage.getItem(TOKEN);
				if (!token) return { estado: 'sem_token' };

				/*
				 * **`AbortController` à mão, e não `AbortSignal.timeout`.** O atalho só existe a partir
				 * do Chrome 103, e estes ecrãs correm na WebView que a box tiver — que numa caixa barata
				 * pode estar anos atrasada. Isto funciona em tudo o que tenha `fetch`.
				 *
				 * O temporizador é limpo no `finally`: sem isso ficava um `setTimeout` vivo por cada
				 * pedido, e num ecrã que está ligado semanas isso conta.
				 */
				const travao = new AbortController();
				const alarme = setTimeout(() => travao.abort(), prazoMs);

				let resposta;
				try {
					resposta = await fetch(caminho, { headers: { authorization: `Bearer ${token}` }, signal: travao.signal });
				} catch {
					/*
					 * Um pedido abortado e uma rede em baixo chegam aqui os dois, e **distinguem-se de
					 * propósito**: para quem está a ver um televisor a falhar numa cozinha, "não há rede"
					 * e "o servidor não respondeu a tempo" mandam procurar em sítios diferentes. O painel
					 * trata os dois da mesma maneira; o que muda é a frase.
					 */
					return { estado: travao.signal.aborted ? 'sem_resposta' : 'sem_rede' };
				} finally {
					clearTimeout(alarme);
				}

				// Um 401 é o caminho de volta ao emparelhamento: o token foi revogado na sede, e
				// insistir com ele só atrasa o ecrã a voltar a funcionar.
				if (resposta.status === 401) {
					localStorage.removeItem(TOKEN);
					location.href = '/';
					return { estado: 'revogado' };
				}

				if (!resposta.ok) return { estado: 'erro' };
				return { estado: 'ok', corpo: await resposta.json().catch(() => null) };
			}

			/**
			 * A densidade sai da contagem, e os degraus são diferentes nas duas áreas.
			 *
			 * Nas entregas o que aperta são 90 cartões estreitos; nas recolhas são 30 cartões largos,
			 * porque cada um leva o nome da fonte. Nenhum degrau esconde nada, em nenhuma das duas.
			 */
			/** Uma tecla desenhada na legenda do rodapé. */
			function criarTecla(texto) {
				const i = document.createElement('i');
				i.textContent = texto;
				return i;
			}

			/*
			 * **Cada corte é o número de lugares que o degrau tem, e não um número redondo.**
			 *
			 * Dizia 42 num `normal` de 36 lugares e 72 num `apertada` de 63, e um turno dessa dimensão
			 * caía ali e mostrava menos, com os que sobravam a não existir e nada no ecrã a dizê-lo.
			 * Hoje cada corte é o número de lugares: 15, 36, 49, e o resto no `cheia`, que tem 72.
			 *
			 * **As duas áreas não têm o mesmo número de degraus, e é medido.** As recolhas têm dois:
			 * nunca houve um ecrã com mais de 26 fontes, e os dois degraus densos que aqui existiam
			 * nunca foram desenhados. Ver a nota no CSS das recolhas.
			 *
			 * Mexer num tamanho lá em cima muda quantas linhas cabem, e portanto muda estes números.
			 * O `degraus.test.ts` compara os dois lados; não se acerta um sem o outro.
			 */
			const DENSIDADES = {
				entregas: [
					[15, 'folgada'],
					[36, 'normal'],
					[49, 'apertada'],
					[Infinity, 'cheia'],
				],
				recolhas: [
					[12, 'folgada'],
					[Infinity, 'normal'],
				],
			};

			function densidade(quantos, area) {
				for (const [ate, nome] of DENSIDADES[area]) if (quantos <= ate) return nome;
				// Inalcançável: o último corte é Infinity. Se lá chegar, alguém tirou-o.
				return 'folgada';
			}

			/**
			 * Que degrau de tamanho o nome precisa, pelo comprimento.
			 *
			 * O nome nunca se corta — sete fontes da base começam por "Continente Bom Dia…" e o que
			 * as distingue está no fim. O que cede é o corpo da letra. Os cortes vêm da medição: 75%
			 * dos nomes cabem no tamanho de base, 22% precisam de um degrau, 3% de dois.
			 */
			function degrauDoNome(texto) {
				const n = texto.length;
				// Uma palavra comprida não quebra, e ocupa uma linha quase sozinha —
				// "ACTIVIDADES HOTELEIRAS" gasta mais espaço do que o número de caracteres sugere.
				const maiorPalavra = Math.max(...texto.split(/\s+/).map((p) => p.length));
				const degrau = (n > 60 ? 3 : n > 45 ? 2 : n > 30 ? 1 : 0) + (maiorPalavra > 12 ? 1 : 0);

				return String(Math.min(3, degrau));
			}

			/**
			 * As pessoas do agregado, no menor número de caracteres que ainda diz a coisa certa.
			 *
			 * **O total é a soma dos dois**, portanto escrevê-lo ao lado da decomposição era dizer o
			 * mesmo duas vezes — e era o que fazia a linha não caber no cartão. Fica `2A 1C`: dois
			 * adultos, uma criança. Quem separa comida numa cozinha precisa da decomposição, não do
			 * total, porque é ela que diz o tamanho do saco.
			 *
			 * **O travessão é "não sabemos", não "zero".** Cerca de metade das rotas tem as contagens
			 * a zero, que é "ninguém preencheu" e não "família de zero pessoas". Escrever *sem
			 * contagem* por extenso era a linha mais comprida do ecrã, e é o caso mais frequente:
			 * a dois metros de distância um travessão onde os outros cartões têm números lê-se como
			 * ausência, que é exactamente o que é.
			 */
			function textoDasPessoas(cartao) {
				const partes = [];
				if (cartao.adultos !== null) partes.push(`${cartao.adultos}A`);
				if (cartao.criancas !== null) partes.push(`${cartao.criancas}C`);
				if (partes.length > 0) return partes.join(' ');

				// Sem decomposição mas com total — não acontece nos dados de hoje, mas o total é um
				// campo à parte e nada na base garante que os três andem juntos.
				if (cartao.pessoas !== null) return `${cartao.pessoas}P`;

				return null;
			}

			/**
			 * O primeiro campo da linha de detalhe: **a hora, quando há**.
			 *
			 * Um extra não estava na escala do dia e não tem hora nenhuma para mostrar. Nada ocupa o
			 * lugar dela — quem diz que o cartão é um extra é a barra ponteada da esquerda, e uma
			 * palavra ali dizia o mesmo uma segunda vez, à custa da linha que o nome do parceiro
			 * precisa.
			 *
			 * O `semHora` é o que as duas áreas fazem de diferente quando não há hora: as recolhas
			 * põem um travessão, porque a hora é a ordem do trabalho e a falta dela é informação; as
			 * entregas não põem nada, porque ali a hora é indicativa e um travessão a mais em metade
			 * dos cartões é ruído. Devolve `null` quando não há nada a acrescentar.
			 */
			function marcaDaEscala(cartao, semHora) {
				if (cartao.hora === null && semHora === null) return null;

				const hora = document.createElement('span');
				hora.className = 'hora';
				hora.textContent = cartao.hora ?? semHora;
				return hora;
			}

			/**
			 * A faixa de notas do rodapé.
			 *
			 * O conteúdo entra **duas vezes** para a volta não ter costura, e a duração sai do
			 * comprimento do texto — a ~14 caracteres por segundo, que é uma velocidade de leitura
			 * confortável para quem está a três metros e a fazer outra coisa ao mesmo tempo.
			 *
			 * `textContent` e nunca `innerHTML`: isto é texto escrito por pessoas, e o dia em que
			 * passar a vir do Odoo ou do D1 não pode haver aqui um caminho para injectar marcação.
			 */
			function desenharNotas(notas) {
				const janela = el('rodape-notas');
				janela.hidden = notas.length === 0;
				if (notas.length === 0) return;

				const fita = el('rodape-fita');
				fita.replaceChildren();

				const comprimento = notas.join('').length;
				fita.style.setProperty('--duracao', `${Math.max(20, Math.round((comprimento * 2) / 14))}s`);

				// Duas cópias: quando a primeira sai, a segunda está onde a primeira começou.
				for (let copia = 0; copia < 2; copia++) {
					const bloco = document.createElement('span');
					// A segunda cópia é decoração: quem usa leitor de ecrã ouve a lista uma vez.
					if (copia === 1) bloco.setAttribute('aria-hidden', 'true');

					for (const nota of notas) {
						const item = document.createElement('span');
						item.textContent = nota;
						bloco.append(item);
					}
					fita.append(bloco);
				}
			}

			/**
			 * O cartão de uma família: número em grande, hora e composição do agregado por baixo.
			 *
			 * **Num parceiro de apoio o nome ocupa o lugar do agregado.** Um parceiro não tem
			 * adultos nem crianças — é uma instituição —, e o espaço estava a mais; o que ali falta
			 * é o que o distingue de outro parceiro, que é o nome. Ver `nomeCurtoDoParceiro`, em
			 * `entregas.ts`: chegam duas palavras, e é o servidor que as corta.
			 *
			 * **Construído por nós e não por `innerHTML`.** Passou a entrar aqui texto vindo do
			 * Odoo, e um nome com `&` ou `<` interpolado numa string de marcação é uma porta que não
			 * tem de existir.
			 */
			function cartaoDeEntrega(cartao) {
				const numero = document.createElement('span');
				numero.className = 'numero';
				numero.textContent = cartao.etiqueta ?? '—';
				if (cartao.etiqueta === null) numero.dataset.semNumero = 'sim';

				const detalhe = document.createElement('span');
				detalhe.className = 'detalhe';

				const escala = marcaDaEscala(cartao, null);
				if (escala) detalhe.append(escala);

				const segundo = document.createElement('span');
				const pessoas = textoDasPessoas(cartao);
				if (cartao.nome) {
					segundo.textContent = cartao.nome;
				} else if (pessoas !== null) {
					segundo.textContent = pessoas;
				} else {
					// O travessão de "sem contagem", cinzento para não se confundir com um número.
					segundo.className = 'sem-contagem';
					segundo.textContent = '—';
				}
				detalhe.append(segundo);

				return [numero, marcaDeEstado(cartao), detalhe];
			}

			/**
			 * O cartão de uma fonte: número e nome numa linha só, hora por baixo.
			 *
			 * **A nota da rota não vem** — o servidor nem sequer a lê. Ver `recolhas.ts`.
			 *
			 * O nome entra por `textContent` — é texto do Odoo e há nomes com `&` lá dentro. O
			 * `<b>` do número é construído, não interpolado.
			 */
			function cartaoDeRecolha(cartao) {
				const identificador = document.createElement('span');
				identificador.className = 'identificador';

				const numero = document.createElement('b');
				numero.textContent = cartao.etiqueta ?? '—';
				identificador.append(numero);

				if (cartao.nome) {
					identificador.append(document.createTextNode(` ${cartao.nome}`));
					identificador.dataset.longo = degrauDoNome(`${cartao.etiqueta ?? ''} ${cartao.nome}`);
				}

				const detalhe = document.createElement('span');
				detalhe.className = 'detalhe';
				detalhe.append(marcaDaEscala(cartao, '—'));

				return [identificador, marcaDeEstado(cartao), detalhe];
			}

			/**
			 * A coluna da direita do cartão: **o peso, quando existe; o símbolo do estado, quando não.**
			 *
			 * É a mesma célula da grelha nos dois casos — trocar um glifo por um número não mexe no
			 * layout. O peso vem formatado do servidor (`'15 kg'`, `'1,2 T'`) porque o arredondamento
			 * tem de ser feito uma vez só: é a soma destes valores que dá o total do cabeçalho.
			 *
			 * **Sem peso não se inventa um zero.** Um cartão fica com o ✓ quando a entrega não tem
			 * peso registado — cabaz em unidades, peso por introduzir —, quando tem falta, ou quando o
			 * valor ficou fora de escala. São casos diferentes com a mesma resposta no ecrã, e o
			 * servidor já os resolveu: aqui só há `peso` ou não há.
			 */
			function marcaDeEstado(cartao) {
				if (cartao.peso) {
					const peso = document.createElement('span');
					peso.className = 'peso';

					// O número e a unidade em elementos separados: o `textContent` é o que evita
					// interpolar HTML com um valor que vem do servidor.
					const partes = cartao.peso.split(' ');
					peso.textContent = partes[0];

					const unidade = document.createElement('small');
					unidade.textContent = partes.slice(1).join(' ');
					peso.append(unidade);

					peso.setAttribute('role', 'img');
					peso.setAttribute('aria-label', `${cartao.estado.replace('_', ' ')}, ${cartao.peso}`);
					return peso;
				}

				const marca = document.createElement('span');
				marca.className = 'marca';
				// O símbolo vem do CSS, mas o significado tem de existir para quem não o vê.
				marca.setAttribute('role', 'img');
				marca.setAttribute('aria-label', cartao.estado.replace('_', ' '));
				return marca;
			}

			/**
			 * O título do separador acompanha o painel que está no ecrã.
			 *
			 * **Chamado de onde a área passa a ser verdade, e não de onde ela muda.** O sítio óbvio era
			 * o `alternarArea`, e seria o errado: ali a área já mudou mas a grelha ainda mostra os
			 * cartões da outra, e continua a mostrá-los se o pedido falhar. Um separador a dizer
			 * "recolhas" por cima de um ecrã de entregas é pior do que um separador desactualizado.
			 *
			 * Num televisor ninguém vê isto — está em ecrã inteiro. Quem vê é quem tem meia dúzia de
			 * separadores abertos a olhar para ecrãs diferentes, e para esse é a única coisa que os
			 * distingue.
			 */
			function mostrarTitulo() {
				document.title = `Refood — ${area}`;
			}

			function desenharGrelha(painel) {
				const grelha = el('grelha');
				grelha.dataset.area = area;
				mostrarTitulo();
				grelha.dataset.densidade = densidade(painel.cartoes.length, area);
				grelha.replaceChildren();

				for (const cartao of painel.cartoes) {
					const div = document.createElement('div');
					div.className = 'cartao';
					// O estado viaja como dado e não como classe: um estado novo não precisa de
					// nenhuma linha nova aqui, só de um bloco de CSS.
					div.dataset.estado = cartao.estado;
					// E o extra viaja **ao lado** do estado, e não dentro dele: um extra está
					// entregue ou com falta como qualquer outro cartão. Ver o CSS.
					if (cartao.extra) div.dataset.extra = 'sim';
					div.append(...(area === 'recolhas' ? cartaoDeRecolha(cartao) : cartaoDeEntrega(cartao)));
					grelha.append(div);
				}

				el('vazio').hidden = painel.cartoes.length > 0;

				/*
				 * **Conta-se sempre, e conta-se aqui.** É o único sítio por onde todos os desenhos da
				 * grelha passam — mudar de dia, de turno, de área, ou a leitura dos 60 segundos. Num
				 * sítio mais acima, o próximo caminho novo esquecia-se dele, que é como este género de
				 * verificação morre.
				 */
				mostrarForaDoEcra(painel.cartoes.length);
			}

			/** Um píxel de tolerância, para o arredondamento do traçado não contar como cartão perdido. */
			const MARGEM_DO_ECRA = 1;

			/**
			 * Quantos cartões é que o painel desenhou e o ecrã não está a mostrar.
			 *
			 * **Compara-se o que se desenhou com o que se vê, e não com uma conta.** Uma conta é
			 * exactamente o que já esteve errado — as colunas e as linhas de cada degrau eram números
			 * escritos à mão contra um máximo de famílias que deixou de valer. Aqui pergunta-se ao
			 * browser onde é que cada cartão ficou, depois de ele ter feito as contas dele.
			 *
			 * **Os limites são a banda entre o cabeçalho e o rodapé, não a janela.** Um cartão pode
			 * estar dentro da janela e por baixo do rodapé: quando a grelha fica mais alta do que a
			 * faixa que tem, é isso que acontece à última fila, e do sofá lê-se como um cartão cortado
			 * ao meio por uma linha cinzenta. Conta como não estar no ecrã, porque não está.
			 *
			 * O rodapé tem altura fixa, por isso este limite não depende de haver notas ou não.
			 */
			function contarForaDoEcra() {
				const cartoes = el('grelha').children;
				if (cartoes.length === 0) return 0;

				const topo = document.querySelector('header').getBoundingClientRect().bottom;
				const fundo = document.querySelector('.rodape').getBoundingClientRect().top;
				const largura = window.innerWidth;

				let fora = 0;
				for (const cartao of cartoes) {
					const caixa = cartao.getBoundingClientRect();
					const dentro =
						caixa.left >= -MARGEM_DO_ECRA &&
						caixa.right <= largura + MARGEM_DO_ECRA &&
						caixa.top >= topo - MARGEM_DO_ECRA &&
						caixa.bottom <= fundo + MARGEM_DO_ECRA;
					if (!dentro) fora++;
				}
				return fora;
			}

			/**
			 * Põe o número no cabeçalho, ao lado dos outros que dizem o que não está à vista.
			 *
			 * Escondido quando é zero, que é o caso normal e o que se espera para sempre. Quando não
			 * é, fica vermelho: ao contrário do `fora de escala`, que é uma estranheza do Odoo, isto é
			 * a app a falhar no que lhe compete.
			 */
			function mostrarForaDoEcra(quantosVieram) {
				const fora = contarForaDoEcra();

				el('fora-do-ecra-grupo').hidden = fora === 0;
				el('fora-do-ecra').textContent = fora;

				/*
				 * E fica registado, porque um televisor numa cozinha não tem ninguém a olhar para a
				 * consola — mas quando alguém for lá ver porque é que faltam famílias, a linha está lá.
				 */
				if (fora > 0) {
					console.warn(
						`[painel] ${fora} de ${quantosVieram} cartões ficaram fora do ecrã (área ${area}, densidade ${el('grelha').dataset.densidade}).`,
					);
				}
			}

			function desenharCabecalho(painel) {
				el('dia').textContent = painel.nomeDoDia;
				el('relacao').textContent = painel.relacao;

				el('dia-anterior').dataset.inativa = painel.podeRecuar ? 'nao' : 'sim';
				el('dia-seguinte').dataset.inativa = painel.podeAvancar ? 'nao' : 'sim';

				/*
				 * As contagens.
				 *
				 * **As faltas passaram a existir nas duas áreas.** Este bloco escondia o contador de
				 * faltas nas recolhas, porque "uma fonte sem excedentes não é falta de ninguém" — e
				 * isso continua a ser verdade, mas o "sem excedente" tem produto próprio e conta como
				 * tratado. Faltas nas recolhas há: 25 na base, desde 2024-10-31.
				 *
				 * **O peso é dois números com o número de entregas, nunca um só.** 112 entregas da
				 * base trazem quilos *e* um cabaz registado em unidades, e nessas o total subestima
				 * sem cura possível — um cabaz não é exprimível em quilos. Somar as duas coisas numa
				 * linha era inventar uma equivalência que não existe.
				 */
				const recolhas = area === 'recolhas';

				// **As três primeiras contam a escala, e só a escala.** Os extras não estavam
				// previstos: somá-los ao total fazia o denominador mexer-se durante o turno, e quem
				// olha para o ecrã lê estas contagens para saber quanto falta fazer. Vão à parte,
				// no contador amarelo a seguir. Ver o CSS.
				const previstos = painel.cartoes.filter((c) => !c.extra);
				el('conta-total').textContent = previstos.length;
				el('conta-total-rotulo').textContent = recolhas ? 'fontes' : 'famílias';
				el('conta-feitas').textContent = previstos.filter((c) => c.estado === (recolhas ? 'recolhido' : 'entregue')).length;
				el('conta-feitas-rotulo').textContent = recolhas ? 'recolhidas' : 'entregues';
				el('conta-faltas-grupo').hidden = false;
				el('conta-faltas').textContent = previstos.filter((c) => c.estado === 'falta').length;

				const extras = painel.cartoes.length - previstos.length;
				el('conta-extras-grupo').hidden = extras === 0;
				el('conta-extras').textContent = extras;
				el('conta-extras-rotulo').textContent = extras === 1 ? 'extra' : 'extras';

				el('peso-total-grupo').hidden = !painel.pesoTotal;
				el('peso-total').textContent = painel.pesoTotal ?? '';

				el('fora-de-escala-grupo').hidden = !painel.foraDeEscala;
				el('fora-de-escala').textContent = painel.foraDeEscala ?? 0;

				el('por-identificar-grupo').hidden = !painel.porIdentificar;
				el('por-identificar').textContent = painel.porIdentificar ?? 0;

				el('contagens').hidden = painel.cartoes.length === 0;

				el('vazio').textContent = AREAS[area].vazio;
				el('comando-area').replaceChildren(criarTecla('OK'), document.createTextNode(` ${AREAS[area].outra}`));

				/*
				 * O turno: a hora actual entre as duas setas, e os pontos a dizer em qual se está.
				 *
				 * Não é a lista dos turnos — ver a nota no CSS. Com um turno só, as setas e os
				 * pontos ficam invisíveis mas o espaço mantém-se, para o cabeçalho não saltar quando
				 * se muda para um dia que tenha dois.
				 */
				const controlo = el('turno-controlo');
				controlo.dataset.unico = painel.turnos.length > 1 ? 'nao' : 'sim';
				el('turno-hora').textContent = painel.turno ? (painel.turno.hora ?? painel.turno.nome) : '—';
				// O nome vai por baixo do núcleo: a hora sozinha não distingue dois turnos que
				// comecem à mesma hora, e há-os.
				el('turno-nome').textContent = painel.turno ? painel.turno.nome : '';

				const pontos = el('turno-pontos');
				pontos.replaceChildren();
				for (const opcao of painel.turnos) {
					const ponto = document.createElement('i');
					if (opcao.id === painel.turno?.id) ponto.dataset.actual = 'sim';
					pontos.append(ponto);
				}

				// As setas do turno só valem quando há mais do que um; o CSS esconde-as, e aqui
				// marcam-se para o rato também não as tratar como clicáveis.
				const noLimite = (indice) => painel.turnos.findIndex((t) => t.id === painel.turno?.id) === indice;
				el('turno-anterior').dataset.inativa = painel.turnos.length > 1 && !noLimite(0) ? 'nao' : 'sim';
				el('turno-seguinte').dataset.inativa = painel.turnos.length > 1 && !noLimite(painel.turnos.length - 1) ? 'nao' : 'sim';
			}

			async function carregar() {
				if (aPedir) return;
				aPedir = true;
				proximaLeitura = Date.now() + ACTUALIZACAO_MS;

				try {
					const parametros = new URLSearchParams();
					if (dia !== null) parametros.set('dia', dia);
					if (turno !== null) parametros.set('turno', turno);

					const resposta = await pedir(`${AREAS[area].caminho}?${parametros}`);
					if (resposta.estado === 'sem_token') return void (location.href = '/');
					if (resposta.estado === 'revogado') return;

					if (resposta.estado !== 'ok' || !resposta.corpo?.painel) {
						// O ecrã fica com o que já tinha. Uma grelha velha é melhor do que uma
						// grelha vazia: quem está na cozinha continua a ter por onde se guiar.
						avisar(resposta.estado === 'sem_rede' ? 'Sem ligação à rede.' : 'Sem resposta do servidor.');
						proximaLeitura = Date.now() + RECUO_MS;
						return;
					}

					avisar(null);
					const painel = resposta.corpo.painel;

					// O servidor é quem manda no dia e no turno efectivos — corrige um dia fora da
					// janela ou um turno que não existe naquele dia.
					dia = painel.dia;
					turno = painel.turno?.id ?? null;
					turnosDoDia = painel.turnos;

					desenharCabecalho(painel);
					desenharGrelha(painel);
					desenharNotas(painel.notas ?? []);
				} finally {
					aPedir = false;
				}
			}

			async function mostrarNucleo() {
				const resposta = await pedir('/api/nucleo');
				if (resposta.estado === 'ok' && resposta.corpo?.nucleo?.nome) {
					el('nucleo').textContent = resposta.corpo.nucleo.nome;
				}
			}

			/**
			 * Mudar de dia **mantém a lógica do turno**: o pedido segue com o turno actual, e o
			 * servidor cai no primeiro turno do dia novo se aquele lá não existir.
			 */
			function mudarDia(quantos) {
				if (dia === null) return;
				const [ano, mes, d] = dia.split('-').map(Number);
				const novo = new Date(Date.UTC(ano, mes - 1, d + quantos));
				dia = `${novo.getUTCFullYear()}-${String(novo.getUTCMonth() + 1).padStart(2, '0')}-${String(novo.getUTCDate()).padStart(2, '0')}`;
				carregar();
			}

			/**
			 * Muda de turno, dentro dos turnos do dia que está a ser mostrado.
			 *
			 * Não dá a volta ao fim da lista de propósito: numa TV, uma seta que não faz nada diz
			 * "chegaste ao fim" sem ambiguidade, e uma que salta do último para o primeiro deixa
			 * quem olha sem saber se andou ou recuou.
			 */
			function mudarTurno(quantos) {
				if (turnosDoDia.length < 2) return;

				const actual = turnosDoDia.findIndex((t) => t.id === turno);
				const seguinte = Math.min(turnosDoDia.length - 1, Math.max(0, (actual === -1 ? 0 : actual) + quantos));
				if (seguinte === actual) return;

				turno = turnosDoDia[seguinte].id;
				carregar();
			}

			/**
			 * O gancho para alternar entre Entregas (BF) e Recolhas (FA).
			 *
			 * **As Recolhas ainda não existem**, e por isso isto não faz nada — mas o estado, a
			 * tecla e o rodapé já estão no sítio, para o dia em que existirem ser uma rota nova e
			 * não uma reforma da interação. Enquanto não houver, o rodapé diz que está por vir em
			 * vez de mostrar um ecrã vazio.
			 */
			/**
			 * As duas áreas do painel, e o que cada uma pede ao servidor.
			 *
			 * O OK do comando alterna entre elas, e **só a que está no ecrã é que refresca**: a outra
			 * não faz pedido nenhum enquanto estiver escondida. Com 65 ecrãs a bater numa base
			 * on-premise, dois painéis a actualizarem-se em paralelo seriam o dobro da carga para
			 * mostrar metade.
			 */
			const AREAS = {
				entregas: { caminho: '/api/entregas', outra: 'recolhas', vazio: 'Sem entregas neste turno.' },
				recolhas: { caminho: '/api/recolhas', outra: 'entregas', vazio: 'Sem recolhas neste turno.' },
			};

			/**
			 * A área em que o ecrã está. Começa no painel por omissão e o comando alterna-a.
			 *
			 * **A escolha da sede só decide por onde se começa.** Quem está na cozinha carrega no OK e
			 * vai para a outra, e isso não volta para a base: é uma preferência do momento, não
			 * configuração. Um televisor que reinicie a meio da tarde volta ao painel inicial, e é o
			 * que se quer — a escolha da sede é sobre a manhã seguinte, não sobre esta hora.
			 */
			let area = 'entregas';

			/**
			 * Lê a configuração deste ecrã e põe a área inicial no sítio antes do primeiro pedido.
			 *
			 * **Tolera tudo o que não reconhecer, e não é preguiça.** São 65 televisores que se
			 * actualizam ao recarregar a página, cada um quando lhe calha: durante um lançamento há
			 * versões diferentes ao mesmo tempo, e um ecrã antigo pode receber o nome de um painel que
			 * ainda não sabe desenhar. Cair no painel por omissão é mostrar entregas; rebentar é
			 * mostrar um ecrã preto numa cozinha.
			 *
			 * Sem rede também não insiste: o `carregar()` que vem a seguir trata da falta de rede, e
			 * começar nas entregas é melhor do que não começar.
			 */
			async function escolherAreaInicial() {
				/*
				 * **Prazo curto, e não o dos outros pedidos.**
				 *
				 * Isto corre **antes** do `carregar` e do `ciclo`, e é a única coisa no arranque que os
				 * segura. Os quinze segundos que chegam a uma leitura de dados são de mais aqui: são
				 * quinze segundos de ecrã vazio à espera de uma configuração de que se pode perfeitamente
				 * passar. Quatro, e segue-se — abrir no painel errado resolve-se com uma tecla do
				 * comando, não abrir não tem cura.
				 */
				const resposta = await pedir('/api/ecra', PRAZO_DA_CONFIGURACAO_MS);
				const escolhido = resposta.corpo?.ecra?.painel_inicial ?? null;
				if (escolhido === null) return;

				if (!Object.hasOwn(AREAS, escolhido)) {
					console.warn(`[painel] painel inicial desconhecido: ${escolhido}. Fica em ${area}.`);
					return;
				}
				area = escolhido;

				// Já aqui, e não só no primeiro desenho: um ecrã que abra nas recolhas não tem de passar
				// pelo separador a dizer "entregas" enquanto o primeiro pedido não volta.
				mostrarTitulo();
			}

			function alternarArea() {
				area = AREAS[area].outra;
				// O turno é do dia e da área: o mesmo dia pode ter turnos diferentes nas duas, e um
				// id de turno de entregas não quer dizer nada nas recolhas. O servidor cai no
				// primeiro turno quando não reconhece o que lhe mandam.
				turno = null;
				carregar();
			}

			/*
			 * **A navegação é toda por teclado, e nada neste ecrã é focável.**
			 *
			 * O browser de uma Android TV usa as setas do comando para mover o foco entre elementos
			 * clicáveis. Com um `<button>` no ecrã, cada seta fazia duas coisas: a nossa navegação e
			 * o salto de foco do browser. Por isso os controlos são `<div>` — que não entram na
			 * navegação por foco — e quem ouve as teclas é a janela, na fase de captura.
			 *
			 * O `preventDefault` não é zelo: sem ele, a seta que já tratámos ainda ia rolar a página
			 * ou mover o foco por baixo de nós.
			 *
			 * O `repeat` é ignorado porque uma seta ficada premida no comando dispara dezenas de
			 * vezes por segundo, e cada uma destas acções faz um pedido ao servidor.
			 */
			addEventListener(
				'keydown',
				(evento) => {
					if (evento.repeat || evento.altKey || evento.ctrlKey || evento.metaKey) return;

					// O OK do comando chega como `Enter` na maioria das boxes, mas há WebViews antigas
					// onde vem como `KEYCODE_DPAD_CENTER` (23) sem `key` reconhecido.
					const ok = evento.key === 'Enter' || evento.keyCode === 13 || evento.keyCode === 23;

					const accao =
						evento.key === 'ArrowLeft'
							? () => mudarDia(-1)
							: evento.key === 'ArrowRight'
								? () => mudarDia(1)
								: evento.key === 'ArrowUp'
									? () => mudarTurno(-1)
									: evento.key === 'ArrowDown'
										? () => mudarTurno(1)
										: ok
											? () => alternarArea()
											: null;

					if (!accao) return;

					evento.preventDefault();
					accao();
				},
				{ capture: true },
			);

			// O rato continua a funcionar, para se poder testar num PC. É o acessório, não o caminho:
			// na cozinha não há rato nenhum.
			el('dia-anterior').addEventListener('click', () => mudarDia(-1));
			el('dia-seguinte').addEventListener('click', () => mudarDia(1));
			el('turno-anterior').addEventListener('click', () => mudarTurno(-1));
			el('turno-seguinte').addEventListener('click', () => mudarTurno(1));
			el('comando-area').addEventListener('click', () => alternarArea());

			/*
			 * O relógio, no fuso de Lisboa e não no do televisor.
			 *
			 * Uma box de cozinha arranca sozinha e pode nem ter fuso configurado; o `Intl` com o
			 * fuso escrito à mão dá a hora certa mesmo quando o relógio do aparelho está em UTC.
			 * É a mesma decisão do dia Refood, do lado do Worker.
			 */
			const RELOGIO = new Intl.DateTimeFormat('pt-PT', { timeZone: 'Europe/Lisbon', hour: '2-digit', minute: '2-digit', hour12: false });

			function mostrarHoras() {
				el('agora').textContent = RELOGIO.format(new Date());
			}

			/** Um tique por segundo, um pedido de trinta em trinta. Nada disto mexe no dia nem no turno. */
			function ciclo() {
				mostrarHoras();
				if (Date.now() >= proximaLeitura) carregar();
				setTimeout(ciclo, 1000);
			}

			/**
			 * O arranque, por ordem.
			 *
			 * A área inicial vem **antes** do primeiro `carregar()`, e essa ordem é a funcionalidade:
			 * a correr em paralelo, o ecrã abria nas entregas e saltava para as recolhas um instante
			 * depois, que numa cozinha se lê como avaria. Custa uma ida ao servidor no arranque, uma
			 * vez por arranque, num ecrã que fica ligado semanas.
			 *
			 * O nome do núcleo não espera por ninguém: aparece quando chegar.
			 */
			async function arrancar() {
				mostrarNucleo();
				await escolherAreaInicial();
				carregar();
				ciclo();
			}

			arrancar();
		</script>
	</body>
</html>
